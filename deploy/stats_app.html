<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Посетители сайта</title>
<!-- Мини-приложение Telegram: открывается кнопкой «Графики» в боте студии. Данные отдаёт сервис заявок
     (/api/stats/data?p=1h|24h|7|30|90) только тем, кому Telegram подписал запуск (разработчик и дизайнер студии). -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-1: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series: #2a78d6;
    --series-wash: rgba(42, 120, 214, 0.10);
    --up: #006300;
    --down: #d03b3b;
    --ghost: rgba(11, 11, 11, 0.05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-1: #f0efec;
    --text-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series: #3987e5;
    --series-wash: rgba(57, 135, 229, 0.10);
    --up: #0ca30c;
    --down: #e66767;
    --ghost: rgba(255, 255, 255, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text-1); }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px 16px 40px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
  /* периоды: 4 кнопки в первом ряду, 3 — во втором (сетка из 12 колонок) */
  .filters { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin: 0 0 14px; }
  .filters button { grid-column: span 3; min-width: 0; font: inherit; font-size: 13px; color: var(--text-1); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 4px; cursor: pointer; white-space: nowrap; }
  .filters button:nth-child(n+5) { grid-column: span 4; }
  @media (max-width: 359px) { .filters { gap: 4px; } .filters button { font-size: 12px; padding: 7px 2px; } }
  .filters button[aria-pressed="true"] { background: var(--text-1); color: var(--page); border-color: var(--text-1); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: 0 0 12px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .card .note { color: var(--text-2); font-size: 13px; margin: 0 0 10px; }
  .card .bars + .note { margin-top: 14px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .tile .label { color: var(--text-2); font-size: 13px; }
  .tile .value { font-size: 26px; font-weight: 600; line-height: 1.15; margin-top: 2px; white-space: nowrap; }
  @media (max-width: 359px) { .tile .value { font-size: 22px; } }
  .tile.hero, .tile.wide { grid-column: 1 / -1; }
  .tile .split { color: var(--text-2); font-size: 13px; margin-top: 2px; }
  .tile.hero .value { font-size: 48px; }
  .delta { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .delta .up { color: var(--up); font-weight: 600; }
  .delta .down { color: var(--down); font-weight: 600; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 140px; display: none; z-index: 2; }
  .tip .d { color: var(--text-2); margin-bottom: 4px; }
  .tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .tip .row b { font-weight: 600; }
  .tip .row span { color: var(--text-2); }
  .tip .key { display: inline-block; width: 12px; height: 2px; background: var(--series); border-radius: 1px; margin-right: 6px; vertical-align: middle; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(84px, 34%) 1fr; gap: 10px; align-items: center; }
  .bar .name { color: var(--text-1); font-size: 14px; overflow-wrap: anywhere; }
  .bar .track { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar .fill { height: 12px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar .num { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pages { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .pages li { display: grid; gap: 4px; }
  .pages .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .pages .top .t { overflow-wrap: anywhere; }
  .pages .top .n { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pages .avg { color: var(--text-2); font-size: 12px; margin-top: -2px; }
  .pages .line { height: 4px; background: var(--series); border-radius: 0 2px 2px 0; min-width: 2px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-2); font-weight: 500; }
  .empty { color: var(--text-2); padding: 24px 0; text-align: center; }
  .loading { opacity: .5; transition: opacity .2s; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--series); color: #fff; }
  .btn.ghost { background: transparent; color: var(--text-1); border: 1px solid var(--border); font-weight: 500; }
  .btn:disabled { opacity: .6; cursor: default; }
  .own { display: grid; gap: 10px; }
  .own .now { font-size: 14px; }
  .own .now b { font-variant-numeric: tabular-nums; }
  .own .ok { color: var(--up); font-weight: 600; }
  .own ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .own li { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; border-top: 1px solid var(--grid); padding-top: 8px; }
  .own li .meta { color: var(--text-2); font-size: 12px; }
  .err { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; color: var(--text-2); }
  /* «1 час»: карточка посетителя */
  .visit .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .visit .place { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .visit .place .flag { margin-right: 4px; }
  .visit .when { color: var(--text-2); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .visit .live { color: var(--up); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .visit .live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--up); margin-right: 6px; vertical-align: 1px; }
  .visit .meta { color: var(--text-2); font-size: 13px; margin-top: 3px; }
  .visit .meta b { color: var(--text-1); font-weight: 600; }
  .trail { list-style: none; margin: 10px 0 0; padding: 0; }
  .trail li { display: grid; grid-template-columns: 42px 1fr auto; gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--grid); align-items: baseline; }
  .trail .tm { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .trail .pt { font-size: 14px; overflow-wrap: anywhere; }
  .trail .nf .pt { color: var(--down); }
  .trail .du { color: var(--text-2); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trail .du.now { color: var(--up); font-weight: 600; }
  .trail .evs { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .trail .ev { font-size: 12px; background: var(--ghost); border-radius: 999px; padding: 2px 9px; }
  .foot { color: var(--muted); font-size: 12px; margin: 4px 2px 0; }
</style>
</head>
<body>
  <h1>Посетители сайта</h1>
  <p class="sub" id="sub">dumskaya-design.com</p>
  <div class="filters" role="group" aria-label="Период">
    <button type="button" data-p="1h" aria-pressed="false">1 час</button>
    <button type="button" data-p="24h" aria-pressed="false">24 часа</button>
    <button type="button" data-p="7" aria-pressed="true">7 дней</button>
    <button type="button" data-p="30" aria-pressed="false">30 дней</button>
    <button type="button" data-p="90" aria-pressed="false">90 дней</button>
    <button type="button" data-p="365" aria-pressed="false">Год</button>
    <button type="button" data-p="all" aria-pressed="false">Всё время</button>
  </div>
  <main id="app"><p class="empty">Загружаю…</p></main>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const PERIODS = ['1h', '24h', '7', '30', '90', '365', 'all'];
  const MON_AXIS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const MONTHS_NOM = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const app = document.getElementById('app');
  let period = '7', data = null;
  try { const p = localStorage.getItem('stats-period'); if (PERIODS.includes(p)) period = p; } catch (e) {}

  function theme() {
    const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (tg) { try { const bg = dark ? '#0d0d0d' : '#f9f9f7'; tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {} }
  }
  if (tg) { tg.ready(); tg.expand(); tg.onEvent('themeChanged', () => { theme(); if (data) render(); }); }
  theme();

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const fmt = (n) => (n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace('.', ',') + ' тыс.' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '));
  const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const dshort = (s) => { const d = pd(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  const dlong = (s) => { const d = pd(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  // время — по часам телефона того, кто смотрит
  const at = (ts) => new Date(ts * 1000);
  const two = (n) => String(n).padStart(2, '0');
  const hm = (ts) => { const d = at(ts); return two(d.getHours()) + ':' + two(d.getMinutes()); };
  const dayword = (ts) => {
    const d = at(ts), t = new Date(); const k = (x) => x.getFullYear() * 400 + x.getMonth() * 32 + x.getDate();
    const y = new Date(t); y.setDate(t.getDate() - 1);
    return k(d) === k(t) ? 'сегодня' : k(d) === k(y) ? 'вчера' : d.getDate() + ' ' + MONTHS[d.getMonth()];
  };
  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
  const dur = (s) => {
    const N = '\u00a0';                  // неразрывный пробел: «5 мин 40 с» не разрывается
    if (s < 60) return s + N + 'с';
    if (s < 3600) { const m = Math.floor(s / 60), r = s % 60; return m < 10 && r ? m + N + 'мин' + N + r + N + 'с' : m + N + 'мин'; }
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h + N + 'ч' + (m ? N + m + N + 'мин' : '');
  };
  const SVG = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  function niceMax(v) { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

  // Оси и подписи: по часам (24 часа), дням (7/30/90), неделям или месяцам (год, всё время)
  const hourly = () => data.unit === 'hour';
  const U = {
    hour: { by: 'часам', one: 'час', head: 'Час', open: 'Полая точка — текущий час, он ещё идёт.' },
    day: { by: 'дням', one: 'день', head: 'День', open: 'Полая точка — сегодня, день ещё идёт.' },
    week: { by: 'неделям', one: 'неделю', head: 'Неделя', open: 'Полая точка — текущая неделя, она ещё идёт.' },
    month: { by: 'месяцам', one: 'месяц', head: 'Месяц', open: 'Полая точка — текущий месяц, он ещё идёт.' },
  };
  const u = () => U[data.unit] || U.day;
  function ticks(rows) {
    if (hourly()) return rows.map((r, i) => (at(r.ts).getHours() % 6 === 0 ? i : -1)).filter((i) => i >= 0);
    if (data.unit === 'day') return rows.length <= 7 ? rows.map((_, i) => i) : [0, Math.round((rows.length - 1) / 2), rows.length - 1];
    // недели и месяцы: подпись там, где начинается месяц, но не больше шести
    let idx = rows.map((_, i) => i).filter((i) => data.unit === 'month' || i === 0 || pd(rows[i].date).getMonth() !== pd(rows[i - 1].date).getMonth());
    const step = Math.ceil(idx.length / 6);
    return idx.filter((_, k) => k % step === 0);
  }
  function tickText(rows, i) {
    if (hourly()) return two(at(rows[i].ts).getHours()) + ':00';
    const d = pd(rows[i].date);
    if (data.unit === 'week' || data.unit === 'month') return MON_AXIS[d.getMonth()] + (i === 0 || d.getMonth() === 0 ? ' ' + d.getFullYear() : '');
    return rows.length <= 7 ? WD[d.getDay()] : dshort(rows[i].date);
  }
  function rowTitle(r, short) {
    const now = ' (идёт, до ' + hm(data.generated_ts) + ')';
    if (hourly()) {
      const d = at(r.ts), h = d.getHours();
      return (short ? '' : WD[d.getDay()] + ', ') + d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + two(h) + ':00–' + two((h + 1) % 24) + ':00'
        + (r.partial && !short ? now : '');
    }
    const part = !short && !r.partial && !r.missing && r.days < r.span ? ' (данные за ' + r.days + ' из ' + r.span + ' дн.)' : '';
    if (data.unit === 'week') {
      const a = pd(r.date), b = pd(r.end);
      if (short) return dshort(r.date);
      return a.getDate() + (a.getMonth() !== b.getMonth() ? ' ' + MONTHS[a.getMonth()] + ' ' : '') + '–' + b.getDate() + ' ' + MONTHS[b.getMonth()]
        + ' ' + b.getFullYear() + (r.partial ? now : part);
    }
    if (data.unit === 'month') {
      const a = pd(r.date);
      return (short ? MONTHS[a.getMonth()] : MONTHS_NOM[a.getMonth()]) + ' ' + a.getFullYear() + (short ? '' : r.partial ? now : part);
    }
    return (short ? dshort(r.date) : dlong(r.date)) + (r.partial && !short ? ' (сегодня, до ' + hm(data.generated_ts) + ')' : '');
  }
  // Подписи оси X без наложений: подпись, которая залезла бы на предыдущую, пропускается
  function axisLabels(svg, rows, xf, H, edges) {
    let right = -Infinity, year = null;
    const long = data.unit === 'week' || data.unit === 'month';
    ticks(rows).forEach((i) => {
      const d = long ? pd(rows[i].date) : null;   // у недель и месяцев год — у первой подписи и там, где он сменился
      const text = long ? MON_AXIS[d.getMonth()] + (d.getFullYear() !== year ? ' ' + d.getFullYear() : '') : tickText(rows, i);
      const w = text.length * 6.3;
      const anchor = edges && i === 0 ? 'start' : edges && i === rows.length - 1 ? 'end' : 'middle';
      const x0 = anchor === 'start' ? xf(i) : anchor === 'end' ? xf(i) - w : xf(i) - w / 2;
      if (x0 < right + 8) return;
      right = x0 + w;
      if (long) year = d.getFullYear();
      const t = sv('text', { x: xf(i), y: H - 6, 'text-anchor': anchor }); t.textContent = text; svg.append(t);
    });
  }
  const unitWord = () => u().by;
  const prevLabel = () => (hourly() ? 'прошлым 24 часам' : period === '365' ? 'прошлому году' : 'прошлым ' + period + ' дням');
  const sameLabel = () => (hourly() ? 'столько же, сколько в прошлые 24 часа' : period === '365' ? 'столько же, сколько за прошлый год'
    : 'столько же, сколько в прошлые ' + period + ' дней');
  const comparable = () => period !== 'all';

  function card(title, note) {
    const c = el('section', 'card'); c.append(el('h2', null, title)); if (note) c.append(el('p', 'note', note)); return c;
  }

  function delta(cur, prev, show) {
    const d = el('div', 'delta');
    if (prev == null || cur == null) { d.textContent = 'сравнения пока нет'; return d; }
    const diff = cur - prev;
    if (!diff) { d.textContent = sameLabel(); return d; }
    const s = el('span', diff > 0 ? 'up' : 'down', (diff > 0 ? '▲ ' : '▼ ') + (diff > 0 ? '+' : '−') + (show || fmt)(Math.abs(diff)));
    const pct = prev ? ' (' + (diff > 0 ? '+' : '−') + Math.round(Math.abs(diff) / prev * 100) + ' %)' : '';
    d.append(s, document.createTextNode(pct + ' к ' + prevLabel()));
    return d;
  }

  function tile(label, value, opts) {
    const o = opts || {};
    const t = el('div', 'tile' + (o.kind ? ' ' + o.kind : ''));
    t.append(el('div', 'label', label), el('div', 'value', value == null ? '—' : (o.show || fmt)(value)));
    if (o.split) t.append(el('div', 'split', o.split));
    if (o.compare) t.append(delta(value, o.prev, o.show));
    return t;
  }

  // Линия по дням или часам (одна серия, площадь — лёгкая заливка), перекрестие и подсказка с остальными цифрами
  function lineChart(rows, key, tipRows) {
    const wrap = el('div', 'chart');
    const W = Math.max(300, app.clientWidth - 30), H = 190, L = 34, R = 10, T = 10, B = 24;
    const pw = W - L - R, ph = H - T - B;
    const vals = rows.map((r) => (r.missing ? null : r[key]));
    const max = niceMax(Math.max(1, ...vals.filter((v) => v != null)));
    const x = (i) => L + (rows.length === 1 ? pw / 2 : (i * pw) / (rows.length - 1));
    const y = (v) => T + ph - (v / max) * ph;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'График по ' + unitWord() });
    for (const g of [0, max / 2, max]) {
      svg.append(sv('line', { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: g === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
      const t = sv('text', { x: L - 6, y: y(g) + 4, 'text-anchor': 'end' }); t.textContent = fmt(Math.round(g)); svg.append(t);
    }
    // отрезки без пропусков (периоды без данных разрывают линию)
    let seg = [];
    const flush = () => {
      if (seg.length > 1) {
        const pts = seg.map((i) => `${x(i)},${y(vals[i])}`).join(' ');
        svg.append(sv('polygon', { points: `${x(seg[0])},${y(0)} ${pts} ${x(seg[seg.length - 1])},${y(0)}`, fill: 'var(--series-wash)' }));
        svg.append(sv('polyline', { points: pts, fill: 'none', stroke: 'var(--series)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      }
      seg = [];
    };
    // текущий неполный день или час в линию не входит (иначе график «падает») — отдельная полая точка
    vals.forEach((v, i) => { if (v == null || rows[i].partial) flush(); else seg.push(i); });
    flush();
    const last = vals.length - 1;
    let lastFull = -1;
    vals.forEach((v, i) => { if (v != null && !rows[i].partial) lastFull = i; });
    if (lastFull >= 0) {
      const v = vals[lastFull];
      svg.append(sv('circle', { cx: x(lastFull), cy: y(v), r: 4, fill: 'var(--series)', stroke: 'var(--surface)', 'stroke-width': 2 }));
      const t = sv('text', { x: x(lastFull) - 7, y: y(v) - 9, 'text-anchor': 'end', style: 'fill:var(--text-1);font-weight:600' });
      t.textContent = fmt(v); svg.append(t);
    }
    if (rows[last].partial && vals[last] != null) {
      svg.append(sv('circle', { cx: x(last), cy: y(vals[last]), r: 4, fill: 'var(--surface)', stroke: 'var(--series)', 'stroke-width': 2 }));
    }
    axisLabels(svg, rows, x, H, true);
    const cross = sv('line', { y1: T, y2: T + ph, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' });
    const dot = sv('circle', { r: 4, fill: 'var(--series)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
    svg.append(cross, dot);
    const hit = sv('rect', { x: L, y: 0, width: pw, height: H, fill: 'transparent', tabindex: 0 });
    svg.append(hit);
    const tip = el('div', 'tip');
    wrap.append(svg, tip);
    let cur = last;
    function show(i) {
      cur = i;
      const r = rows[i];
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
      if (vals[i] != null) { dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(vals[i])); dot.setAttribute('visibility', 'visible'); }
      else dot.setAttribute('visibility', 'hidden');
      tip.replaceChildren(el('div', 'd', rowTitle(r)));
      if (r.missing) tip.append(el('div', null, 'нет данных'));
      else tipRows(r).forEach(([name, v, keyed]) => {
        const row = el('div', 'row'); const lab = el('span');
        if (keyed) lab.append(el('i', 'key')); lab.append(document.createTextNode(name));
        row.append(lab, el('b', null, typeof v === 'string' ? v : fmt(v))); tip.append(row);
      });
      tip.style.display = 'block';
      const scale = svg.getBoundingClientRect().width / W;
      const px = x(i) * scale, tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(0, px - tw / 2), wrap.clientWidth - tw) + 'px';
      tip.style.top = '-8px';
    }
    function hide() { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); }
    function pick(ev) {
      const b = svg.getBoundingClientRect(); const sx = (ev.clientX - b.left) * (W / b.width);
      return Math.max(0, Math.min(rows.length - 1, Math.round(((sx - L) / pw) * (rows.length - 1))));
    }
    hit.addEventListener('pointermove', (ev) => show(pick(ev)));
    hit.addEventListener('pointerdown', (ev) => show(pick(ev)));
    hit.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') hide(); });
    hit.addEventListener('focus', () => show(cur));
    hit.addEventListener('blur', hide);
    hit.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowLeft') { show(Math.max(0, cur - 1)); ev.preventDefault(); }
      if (ev.key === 'ArrowRight') { show(Math.min(rows.length - 1, cur + 1)); ev.preventDefault(); }
    });
    return wrap;
  }

  // Столбики по дням или часам (одна серия): ≤ 24 px, скругление 4 px сверху, зазор 2 px
  function columnChart(rows, key, tipRows) {
    const wrap = el('div', 'chart');
    const W = Math.max(300, app.clientWidth - 30), H = 160, L = 34, R = 6, T = 10, B = 24;
    const pw = W - L - R, ph = H - T - B;
    const vals = rows.map((r) => (r.missing ? 0 : r[key]));
    const max = niceMax(Math.max(1, ...vals));
    const band = pw / rows.length, bw = Math.max(2, Math.min(24, band - 2));
    const y = (v) => T + ph - (v / max) * ph;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Столбики по ' + unitWord() });
    for (const g of [0, max / 2, max]) {
      svg.append(sv('line', { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: g === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
      const t = sv('text', { x: L - 6, y: y(g) + 4, 'text-anchor': 'end' }); t.textContent = fmt(Math.round(g)); svg.append(t);
    }
    const tip = el('div', 'tip');
    const bars = [];
    rows.forEach((r, i) => {
      const v = vals[i], cx = L + band * i + band / 2, h = (v / max) * ph, x0 = cx - bw / 2, top = T + ph - h;
      const rr = Math.min(4, bw / 2, h);
      const d = h <= 0 ? '' : `M${x0},${T + ph} V${top + rr} Q${x0},${top} ${x0 + rr},${top} H${x0 + bw - rr} Q${x0 + bw},${top} ${x0 + bw},${top + rr} V${T + ph} Z`;
      const p = sv('path', { d, fill: 'var(--series)', opacity: r.partial ? 0.55 : 1 });
      svg.append(p); bars.push(p);
      const hit = sv('rect', { x: L + band * i, y: T, width: band, height: ph + B, fill: 'transparent', tabindex: 0 });
      const on = () => {
        bars.forEach((b, k) => b.setAttribute('opacity', k === i ? 1 : (rows[k].partial ? 0.35 : 0.55)));
        tip.replaceChildren(el('div', 'd', rowTitle(r)));
        if (r.missing) tip.append(el('div', null, 'нет данных'));
        else tipRows(r).forEach(([name, val]) => { const row = el('div', 'row'); row.append(el('span', null, name), el('b', null, fmt(val))); tip.append(row); });
        tip.style.display = 'block';
        const scale = svg.getBoundingClientRect().width / W, tw = tip.offsetWidth;
        tip.style.left = Math.min(Math.max(0, cx * scale - tw / 2), wrap.clientWidth - tw) + 'px'; tip.style.top = '-8px';
      };
      const off = () => { bars.forEach((b, k) => b.setAttribute('opacity', rows[k].partial ? 0.55 : 1)); tip.style.display = 'none'; };
      hit.addEventListener('pointerenter', on); hit.addEventListener('pointerdown', on); hit.addEventListener('focus', on);
      hit.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') off(); }); hit.addEventListener('blur', off);
      svg.append(hit);
    });
    axisLabels(svg, rows, (i) => L + band * i + band / 2, H, false);
    wrap.append(svg, tip);
    return wrap;
  }

  // Горизонтальные полосы: подпись слева, значение у конца полосы
  function barList(items, unit) {
    const box = el('div', 'bars');
    if (!items.length) { box.append(el('div', 'note', 'Пока нет данных')); return box; }
    const max = Math.max(...items.map((x) => x[1]));
    items.forEach(([name, v]) => {
      const row = el('div', 'bar'); const tr = el('div', 'track'); const f = el('div', 'fill');
      f.style.width = Math.max(1, (v / max) * 82) + '%';
      tr.append(f, el('span', 'num', fmt(v) + (unit || '')));
      row.append(el('div', 'name', name), tr); box.append(row);
    });
    return box;
  }

  function table(rows) {
    const det = el('details'); det.append(el('summary', null, 'Таблица по ' + u().by));
    const t = el('table'); const head = el('tr');

    t.append(head);
    rows.slice().reverse().forEach((r) => {
      const tr = el('tr');
      tr.append(el('td', null, (hourly() ? dayword(r.ts).replace('сегодня', '').trim() + ' ' + two(at(r.ts).getHours()) + ':00' : rowTitle(r, true)).trim() + (r.partial ? ' *' : '')));
      [r.visitors, r.views, r.leads, r.contacts, r.google].forEach((v) => tr.append(el('td', null, r.missing ? '—' : fmt(v))));
      t.append(tr);
    });
    det.append(t, el('p', 'note', hourly()
      ? '* текущий час, до ' + hm(data.generated_ts) + '. Посетители за сутки считаются без повторов: кто заходил в разные часы, учтён один раз, поэтому итог меньше суммы по часам.'
      : '* ' + { day: 'сегодня', week: 'текущая неделя', month: 'текущий месяц' }[data.unit] + ', до ' + hm(data.generated_ts)
        + '. Посетители — сумма по дням: кто заходил в разные дни, учтён в каждом.'));
    return det;
  }

  function render() {

  // «1 час»: каждый посетитель — откуда пришёл, что смотрел и сколько, что нажимал
  const EVENTS = { tel: '📞 Нажатие на телефон', mail: '✉️ Нажатие на e-mail', whatsapp: '💬 Переход в WhatsApp',
    telegram: '💬 Переход в Telegram', lead: '📝 Отправлена заявка' };
  function visitCard(s) {
    const c = el('section', 'card visit');
    const top = el('div', 'top'); const place = el('div', 'place');
    if (s.geo) { if (s.geo.flag) place.append(el('span', 'flag', s.geo.flag)); place.append(document.createTextNode(s.geo.place)); }
    else place.textContent = data.geo ? 'Место не определилось' : 'Город появится после загрузки базы городов';
    top.append(place, s.active ? el('span', 'live', 'на сайте') : el('span', 'when', (dayword(s.start) === 'сегодня' ? '' : dayword(s.start) + ' ') + hm(s.start) + '–' + hm(s.end)));
    c.append(top);
    c.append(el('div', 'meta', [s.device, s.os, s.browser].filter(Boolean).join(' · ') + (s.lang ? ' · язык браузера: ' + s.lang : '')));
    const m2 = el('div', 'meta'); m2.append(document.createTextNode('Откуда: '), el('b', null, s.source === 'прямые заходы' ? 'прямой заход' : s.source));
    const n = s.pages.length;
    const bits = [n + ' ' + plural(n, 'страница', 'страницы', 'страниц')];
    if (s.total) bits.push(dur(s.total) + ' на сайте');
    if (s.active) bits.push('с\u00a0' + hm(s.start));
    if (s.before) bits.push('ранее за сутки: ' + s.before + ' ' + plural(s.before, 'заход', 'захода', 'заходов'));
    m2.append(document.createTextNode(' · ' + bits.join(' · ')));
    c.append(m2);
    const ol = el('ol', 'trail');
    s.pages.forEach((p, i) => {
      const li = el('li', p.nf ? 'nf' : null);
      const last = i === n - 1;
      // ≈ — страница не сообщила своё время (закрыли без сигнала), считаем до открытия следующей; меньше 2 с — неизвестно
      const known = p.secs != null && !(p.approx && p.secs < 2);
      const du = known ? el('span', 'du', p.capped ? 'больше 5\u00a0мин' : (p.approx ? '≈ ' : '') + dur(p.secs))
        : last && s.active ? el('span', 'du now', 'сейчас') : el('span', 'du', '—');
      li.append(el('span', 'tm', hm(p.ts)), el('span', 'pt', p.nf ? 'Страница не найдена: ' + p.path : p.title), du);
      if (p.events.length) {
        const evs = el('div', 'evs');
        p.events.forEach((e) => evs.append(el('span', 'ev', (EVENTS[e.t] || e.t) + ' · ' + hm(e.ts))));
        li.append(evs);
      }
      ol.append(li);
    });
    c.append(ol);
    return c;
  }

  function renderLive() {
    const d = data, sm = d.summary;

      + 'Город — по IP-адресу, примерно: мобильный интернет часто показывает город оператора. '
      + (d.geo ? 'База городов: ' + d.credit + '.' : 'База городов загружается — города появятся через несколько минут.')));
  }

  // «Не считать нас»: свой домашний интернет — визиты с него в статистику не попадают
  let me = null;
  function ownCard() {
    const c = card('Не считать нас в статистике',
      'Нажмите дома, подключившись к домашнему Wi-Fi: телефоны и компьютеры дома выходят в интернет с одного адреса. '
      + 'Мобильный интернет не добавляйте — его адрес общий с другими людьми.');
    const box = el('div', 'own'); c.append(box);
    if (!me) { box.append(el('p', 'note', 'Загружаю…')); return c; }
    const now = el('div', 'now'); now.append(document.createTextNode('Вы сейчас в интернете с адреса '), el('b', null, me.ip));
    box.append(now);
    if (me.excluded) box.append(el('div', 'ok', '✓ Этот интернет уже не считается'));
    else {
      const b = el('button', 'btn', 'Не считать этот интернет'); b.type = 'button';
      b.addEventListener('click', () => ownAction({ action: 'add' }, b));
      box.append(b);
      if (me.items.length) box.append(el('p', 'note', 'Если дома этот адрес новый — провайдер мог его сменить (например, после перезагрузки роутера). Нажмите кнопку ещё раз, старый адрес можно убрать.'));
    }
    if (me.items.length) {
      const ul = el('ul');
      me.items.forEach((it) => {
        const li = el('li'); const left = el('div');
        left.append(el('div', null, it.net.replace(/\/32$/, '')),
          el('div', 'meta', [it.who, 'добавлен ' + dshort(it.added), it.seen && it.seen !== it.added ? 'был ' + dshort(it.seen) : ''].filter(Boolean).join(' · ')));
        const rm = el('button', 'btn ghost', 'Убрать'); rm.type = 'button';
        rm.addEventListener('click', () => ownAction({ action: 'remove', net: it.net }, rm));
        li.append(left, rm); ul.append(li);
      });
      box.append(ul);
    }
    return c;
  }
  async function loadMe() {
    try {
      const r = await fetch('/api/stats/me', { headers: { 'X-Telegram-Init-Data': tg.initData }, cache: 'no-store' });
      me = r.ok ? await r.json() : false;
    } catch (e) { me = false; }
  }
  async function ownAction(body, btn) {
    btn.disabled = true;
    try {
      const r = await fetch('/api/stats/exclude', { method: 'POST', cache: 'no-store',
        headers: { 'X-Telegram-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error();
      me = await r.json();
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
      await load();                       // цифры пересчитаны без своих визитов
    } catch (e) { btn.disabled = false; btn.textContent = 'Не получилось — ещё раз'; }
  }

  let seq = 0;
  async function load(quiet) {
    const init = tg ? tg.initData : '';
    if (!init) {
      app.replaceChildren(el('div', 'err', 'Откройте статистику кнопкой «📈 Графики» в боте студии DUMSKAYA DESIGN.'));
      return;
    }
    const my = ++seq;
    if (!quiet) app.classList.add('loading');
    try {
      const r = await fetch('/api/stats/data?p=' + period, { headers: { 'X-Telegram-Init-Data': init }, cache: 'no-store' });
      if (r.status === 403) throw new Error('Нет доступа: статистика открыта разработчику и дизайнеру студии.');
      if (r.status === 503) throw new Error('Сервис не может прочитать журнал сайта. Выложите сайт ещё раз — выкладка откроет журнал для чтения.');
      if (!r.ok) throw new Error('Сервер не ответил (' + r.status + '). Попробуйте ещё раз через минуту.');
      const got = await r.json();
      if (my !== seq) return;             // пока ждали, выбрали другой период
      data = got;
      if (me === null) await loadMe();
      render();
    } catch (e) {
      if (my === seq && !quiet) app.replaceChildren(el('div', 'err', e.message || String(e)));
    } finally {
      if (my === seq) app.classList.remove('loading');
    }
  }

  const buttons = document.querySelectorAll('.filters button');
  const press = () => buttons.forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.p === period)));
  buttons.forEach((b) => b.addEventListener('click', () => {
    period = b.dataset.p;
    try { localStorage.setItem('stats-period', period); } catch (e) {}
    press();
    load();
  }));
  press();
  // «1 час» обновляется сам, пока приложение открыто
  setInterval(() => { if (period === '1h' && document.visibilityState === 'visible') load(true); }, 60000);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 150); });
  load();
})();
</script>
</body>
</html>

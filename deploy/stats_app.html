<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Посетители сайта</title>
<!-- Мини-приложение Telegram: открывается кнопкой «Графики» в боте студии. Данные отдаёт сервис заявок
     (/api/stats/data) только тем, кому Telegram подписал запуск (разработчик и дизайнер студии). -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-1: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series: #2a78d6;
    --series-wash: rgba(42, 120, 214, 0.10);
    --up: #006300;
    --down: #d03b3b;
    --ghost: rgba(11, 11, 11, 0.05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-1: #f0efec;
    --text-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series: #3987e5;
    --series-wash: rgba(57, 135, 229, 0.10);
    --up: #0ca30c;
    --down: #e66767;
    --ghost: rgba(255, 255, 255, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text-1); }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px 16px 40px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
  .filters { display: flex; gap: 6px; margin: 0 0 14px; }
  .filters button { font: inherit; font-size: 14px; color: var(--text-1); background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--text-1); color: var(--page); border-color: var(--text-1); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: 0 0 12px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .card .note { color: var(--text-2); font-size: 13px; margin: 0 0 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .tile .label { color: var(--text-2); font-size: 13px; }
  .tile .value { font-size: 26px; font-weight: 600; line-height: 1.15; margin-top: 2px; }
  .tile.hero { grid-column: 1 / -1; }
  .tile.hero .value { font-size: 48px; }
  .delta { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .delta .up { color: var(--up); font-weight: 600; }
  .delta .down { color: var(--down); font-weight: 600; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 140px; display: none; z-index: 2; }
  .tip .d { color: var(--text-2); margin-bottom: 4px; }
  .tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .tip .row b { font-weight: 600; }
  .tip .row span { color: var(--text-2); }
  .tip .key { display: inline-block; width: 12px; height: 2px; background: var(--series); border-radius: 1px; margin-right: 6px; vertical-align: middle; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(84px, 34%) 1fr; gap: 10px; align-items: center; }
  .bar .name { color: var(--text-1); font-size: 14px; overflow-wrap: anywhere; }
  .bar .track { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar .fill { height: 12px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar .num { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pages { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .pages li { display: grid; gap: 4px; }
  .pages .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .pages .top .t { overflow-wrap: anywhere; }
  .pages .top .n { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pages .line { height: 4px; background: var(--series); border-radius: 0 2px 2px 0; min-width: 2px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-2); font-weight: 500; }
  .empty { color: var(--text-2); padding: 24px 0; text-align: center; }
  .loading { opacity: .5; transition: opacity .2s; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--series); color: #fff; }
  .btn.ghost { background: transparent; color: var(--text-1); border: 1px solid var(--border); font-weight: 500; }
  .btn:disabled { opacity: .6; cursor: default; }
  .own { display: grid; gap: 10px; }
  .own .now { font-size: 14px; }
  .own .now b { font-variant-numeric: tabular-nums; }
  .own .ok { color: var(--up); font-weight: 600; }
  .own ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .own li { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; border-top: 1px solid var(--grid); padding-top: 8px; }
  .own li .meta { color: var(--text-2); font-size: 12px; }
  .err { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; color: var(--text-2); }
</style>
</head>
<body>
  <h1>Посетители сайта</h1>
  <p class="sub" id="sub">dumskaya-design.com</p>
  <div class="filters" role="group" aria-label="Период">
    <button type="button" data-days="7" aria-pressed="true">7 дней</button>
    <button type="button" data-days="30" aria-pressed="false">30 дней</button>
    <button type="button" data-days="90" aria-pressed="false">90 дней</button>
  </div>
  <main id="app"><p class="empty">Загружаю…</p></main>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const app = document.getElementById('app');
  let days = 7, data = null;

  function theme() {
    const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (tg) { try { const bg = dark ? '#0d0d0d' : '#f9f9f7'; tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {} }
  }
  if (tg) { tg.ready(); tg.expand(); tg.onEvent('themeChanged', () => { theme(); if (data) render(); }); }
  theme();

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const fmt = (n) => (n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace('.', ',') + ' тыс.' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '));
  const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const dshort = (s) => { const d = pd(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  const dlong = (s) => { const d = pd(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  const SVG = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  function niceMax(v) { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

  function card(title, note) {
    const c = el('section', 'card'); c.append(el('h2', null, title)); if (note) c.append(el('p', 'note', note)); return c;
  }

  function delta(cur, prev, label) {
    const d = el('div', 'delta');
    if (prev == null) { d.textContent = label ? 'сравнения пока нет' : ''; return d; }
    const diff = cur - prev;
    if (!diff) { d.textContent = 'столько же, сколько в прошлые ' + days + ' дней'; return d; }
    const s = el('span', diff > 0 ? 'up' : 'down', (diff > 0 ? '▲ ' : '▼ ') + (diff > 0 ? '+' : '−') + fmt(Math.abs(diff)));
    const pct = prev ? ' (' + (diff > 0 ? '+' : '−') + Math.round(Math.abs(diff) / prev * 100) + ' %)' : '';
    d.append(s, document.createTextNode(pct + ' к ' + label));
    return d;
  }

  function tile(label, value, prev, hero) {
    const t = el('div', 'tile' + (hero ? ' hero' : ''));
    t.append(el('div', 'label', label), el('div', 'value', fmt(value)), delta(value, prev, 'прошлым ' + days + ' дням'));
    return t;
  }

  // Линия по дням (одна серия, площадь — лёгкая заливка), перекрестие и подсказка с остальными цифрами дня
  function lineChart(rows, key, tipRows) {
    const wrap = el('div', 'chart');
    const W = Math.max(300, app.clientWidth - 30), H = 190, L = 34, R = 10, T = 10, B = 24;
    const pw = W - L - R, ph = H - T - B;
    const vals = rows.map((r) => (r.missing ? null : r[key]));
    const max = niceMax(Math.max(1, ...vals.filter((v) => v != null)));
    const x = (i) => L + (rows.length === 1 ? pw / 2 : (i * pw) / (rows.length - 1));
    const y = (v) => T + ph - (v / max) * ph;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'График по дням' });
    for (const g of [0, max / 2, max]) {
      svg.append(sv('line', { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: g === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
      const t = sv('text', { x: L - 6, y: y(g) + 4, 'text-anchor': 'end' }); t.textContent = fmt(Math.round(g)); svg.append(t);
    }
    // отрезки без пропусков (дни без данных разрывают линию)
    let seg = [];
    const flush = () => {
      if (seg.length > 1) {
        const pts = seg.map((i) => `${x(i)},${y(vals[i])}`).join(' ');
        svg.append(sv('polygon', { points: `${x(seg[0])},${y(0)} ${pts} ${x(seg[seg.length - 1])},${y(0)}`, fill: 'var(--series-wash)' }));
        svg.append(sv('polyline', { points: pts, fill: 'none', stroke: 'var(--series)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      }
      seg = [];
    };
    // сегодняшний неполный день в линию не входит (иначе график «падает» к вечеру) — отдельная полая точка
    vals.forEach((v, i) => { if (v == null || rows[i].partial) flush(); else seg.push(i); });
    flush();
    const last = vals.length - 1;
    let lastFull = -1;
    vals.forEach((v, i) => { if (v != null && !rows[i].partial) lastFull = i; });
    if (lastFull >= 0) {
      const v = vals[lastFull];
      svg.append(sv('circle', { cx: x(lastFull), cy: y(v), r: 4, fill: 'var(--series)', stroke: 'var(--surface)', 'stroke-width': 2 }));
      const t = sv('text', { x: x(lastFull) - 7, y: y(v) - 9, 'text-anchor': 'end', style: 'fill:var(--text-1);font-weight:600' });
      t.textContent = fmt(v); svg.append(t);
    }
    if (rows[last].partial && vals[last] != null) {
      svg.append(sv('circle', { cx: x(last), cy: y(vals[last]), r: 4, fill: 'var(--surface)', stroke: 'var(--series)', 'stroke-width': 2 }));
    }
    const ticks = rows.length <= 7 ? rows.map((_, i) => i) : [0, Math.round((rows.length - 1) / 2), rows.length - 1];
    ticks.forEach((i) => {
      const t = sv('text', { x: x(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === rows.length - 1 ? 'end' : 'middle' });
      t.textContent = rows.length <= 7 ? WD[pd(rows[i].date).getDay()] : dshort(rows[i].date); svg.append(t);
    });
    const cross = sv('line', { y1: T, y2: T + ph, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' });
    const dot = sv('circle', { r: 4, fill: 'var(--series)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
    svg.append(cross, dot);
    const hit = sv('rect', { x: L, y: 0, width: pw, height: H, fill: 'transparent', tabindex: 0 });
    svg.append(hit);
    const tip = el('div', 'tip');
    wrap.append(svg, tip);
    let cur = last;
    function show(i) {
      cur = i;
      const r = rows[i];
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
      if (vals[i] != null) { dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(vals[i])); dot.setAttribute('visibility', 'visible'); }
      else dot.setAttribute('visibility', 'hidden');
      tip.replaceChildren(el('div', 'd', dlong(r.date) + (r.partial ? ' (сегодня, до ' + data.generated + ')' : '')));
      if (r.missing) tip.append(el('div', null, 'нет данных'));
      else tipRows(r).forEach(([name, v, keyed]) => {
        const row = el('div', 'row'); const lab = el('span');
        if (keyed) lab.append(el('i', 'key')); lab.append(document.createTextNode(name));
        row.append(lab, el('b', null, fmt(v))); tip.append(row);
      });
      tip.style.display = 'block';
      const scale = svg.getBoundingClientRect().width / W;
      const px = x(i) * scale, tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(0, px - tw / 2), wrap.clientWidth - tw) + 'px';
      tip.style.top = '-8px';
    }
    function hide() { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); }
    function at(ev) {
      const b = svg.getBoundingClientRect(); const sx = (ev.clientX - b.left) * (W / b.width);
      return Math.max(0, Math.min(rows.length - 1, Math.round(((sx - L) / pw) * (rows.length - 1))));
    }
    hit.addEventListener('pointermove', (ev) => show(at(ev)));
    hit.addEventListener('pointerdown', (ev) => show(at(ev)));
    hit.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') hide(); });
    hit.addEventListener('focus', () => show(cur));
    hit.addEventListener('blur', hide);
    hit.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowLeft') { show(Math.max(0, cur - 1)); ev.preventDefault(); }
      if (ev.key === 'ArrowRight') { show(Math.min(rows.length - 1, cur + 1)); ev.preventDefault(); }
    });
    return wrap;
  }

  // Столбики по дням (одна серия): ≤ 24 px, скругление 4 px сверху, зазор 2 px
  function columnChart(rows, key, tipRows) {
    const wrap = el('div', 'chart');
    const W = Math.max(300, app.clientWidth - 30), H = 160, L = 34, R = 6, T = 10, B = 24;
    const pw = W - L - R, ph = H - T - B;
    const vals = rows.map((r) => (r.missing ? 0 : r[key]));
    const max = niceMax(Math.max(1, ...vals));
    const band = pw / rows.length, bw = Math.max(2, Math.min(24, band - 2));
    const y = (v) => T + ph - (v / max) * ph;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Столбики по дням' });
    for (const g of [0, max / 2, max]) {
      svg.append(sv('line', { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: g === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
      const t = sv('text', { x: L - 6, y: y(g) + 4, 'text-anchor': 'end' }); t.textContent = fmt(Math.round(g)); svg.append(t);
    }
    const tip = el('div', 'tip');
    const bars = [];
    rows.forEach((r, i) => {
      const v = vals[i], cx = L + band * i + band / 2, h = (v / max) * ph, x0 = cx - bw / 2, top = T + ph - h;
      const rr = Math.min(4, bw / 2, h);
      const d = h <= 0 ? '' : `M${x0},${T + ph} V${top + rr} Q${x0},${top} ${x0 + rr},${top} H${x0 + bw - rr} Q${x0 + bw},${top} ${x0 + bw},${top + rr} V${T + ph} Z`;
      const p = sv('path', { d, fill: 'var(--series)', opacity: r.partial ? 0.55 : 1 });
      svg.append(p); bars.push(p);
      const hit = sv('rect', { x: L + band * i, y: T, width: band, height: ph + B, fill: 'transparent', tabindex: 0 });
      const on = () => {
        bars.forEach((b, k) => b.setAttribute('opacity', k === i ? 1 : (rows[k].partial ? 0.35 : 0.55)));
        tip.replaceChildren(el('div', 'd', dlong(r.date) + (r.partial ? ' (сегодня)' : '')));
        if (r.missing) tip.append(el('div', null, 'нет данных'));
        else tipRows(r).forEach(([name, val]) => { const row = el('div', 'row'); row.append(el('span', null, name), el('b', null, fmt(val))); tip.append(row); });
        tip.style.display = 'block';
        const scale = svg.getBoundingClientRect().width / W, tw = tip.offsetWidth;
        tip.style.left = Math.min(Math.max(0, cx * scale - tw / 2), wrap.clientWidth - tw) + 'px'; tip.style.top = '-8px';
      };
      const off = () => { bars.forEach((b, k) => b.setAttribute('opacity', rows[k].partial ? 0.55 : 1)); tip.style.display = 'none'; };
      hit.addEventListener('pointerenter', on); hit.addEventListener('pointerdown', on); hit.addEventListener('focus', on);
      hit.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') off(); }); hit.addEventListener('blur', off);
      svg.append(hit);
    });
    const ticks = rows.length <= 7 ? rows.map((_, i) => i) : [0, Math.round((rows.length - 1) / 2), rows.length - 1];
    ticks.forEach((i) => {
      const t = sv('text', { x: L + band * i + band / 2, y: H - 6, 'text-anchor': 'middle' });
      t.textContent = rows.length <= 7 ? WD[pd(rows[i].date).getDay()] : dshort(rows[i].date); svg.append(t);
    });
    wrap.append(svg, tip);
    return wrap;
  }

  // Горизонтальные полосы: подпись слева, значение у конца полосы
  function barList(items, unit) {
    const box = el('div', 'bars');
    if (!items.length) { box.append(el('div', 'note', 'Пока нет данных')); return box; }
    const max = Math.max(...items.map((x) => x[1]));
    items.forEach(([name, v]) => {
      const row = el('div', 'bar'); const tr = el('div', 'track'); const f = el('div', 'fill');
      f.style.width = Math.max(1, (v / max) * 82) + '%';
      tr.append(f, el('span', 'num', fmt(v) + (unit || '')));
      row.append(el('div', 'name', name), tr); box.append(row);
    });
    return box;
  }

  function table(rows) {
    const det = el('details'); det.append(el('summary', null, 'Таблица по дням'));
    const t = el('table'); const head = el('tr');
    ['День', 'Посетители', 'Просмотры', 'Заявки', 'Google'].forEach((h) => head.append(el('th', null, h)));
    t.append(head);
    rows.slice().reverse().forEach((r) => {
      const tr = el('tr');
      tr.append(el('td', null, dshort(r.date) + (r.partial ? ' *' : '')));
      [r.visitors, r.views, r.leads, r.google].forEach((v) => tr.append(el('td', null, r.missing ? '—' : fmt(v))));
      t.append(tr);
    });
    det.append(t, el('p', 'note', '* сегодня, до ' + data.generated + '. Посетители за период — сумма по дням.'));
    return det;
  }

  function render() {
    const d = data, tot = d.total, prev = d.prev;
    app.replaceChildren();
    document.getElementById('sub').textContent = 'dumskaya-design.com · обновлено в ' + d.generated
      + (d.coverage < d.days.length ? ' · есть данные за ' + d.coverage + ' из ' + d.days.length + ' дн.' : '');
    if (!d.coverage) { app.append(el('p', 'empty', 'За этот период в журнале сайта ещё нет записей.')); return; }
    const tiles = el('div', 'tiles');
    tiles.append(tile('Посетители', tot.visitors, prev && prev.visitors, true),
      tile('Просмотры страниц', tot.views, prev && prev.views),
      tile('Заявки с сайта', tot.leads, prev && prev.leads));
    app.append(tiles);
    if (tot.own) app.append(el('p', 'note', me ? '🏠 Ваши собственные просмотры (' + fmt(tot.own) + ') не учтены — адреса в блоке «Не считать нас» внизу.'
      : '🏠 Просмотры студии (' + fmt(tot.own) + ') не учтены.'));

    const c1 = card('Посетители по дням', 'Нажмите на график — покажет день целиком');
    c1.append(lineChart(d.days, 'visitors', (r) => [['Посетители', r.visitors, true], ['Просмотры', r.views], ['Заявки', r.leads]]));
    if (d.days[d.days.length - 1].partial) c1.append(el('p', 'note', 'Полая точка — сегодня, день ещё идёт.'));
    c1.append(table(d.days));
    app.append(c1);

    const c2 = card('Языки сайта', 'Посетители по версиям сайта');
    c2.append(barList(tot.langs)); app.append(c2);
    const c3 = card('Откуда пришли', 'Первый переход посетителя за день');
    c3.append(barList(tot.sources)); app.append(c3);
    const c4 = card('Устройства');
    c4.append(barList(tot.devices)); app.append(c4);

    const c5 = card('Популярные страницы', 'Просмотры за период');
    if (tot.pages.length) {
      const ul = el('ol', 'pages'); const max = tot.pages[0][1];
      tot.pages.forEach(([title, n]) => {
        const li = el('li'); const top = el('div', 'top'); top.append(el('span', 't', title), el('span', 'n', fmt(n)));
        const ln = el('div', 'line'); ln.style.width = Math.max(1, (n / max) * 100) + '%';
        li.append(top, ln); ul.append(li);
      });
      c5.append(ul);
    } else c5.append(el('p', 'note', 'Пока нет данных'));
    app.append(c5);

    const c6 = card('Робот Google по дням', 'Сколько страниц прочитал Googlebot — так идёт индексация. За период: '
      + fmt(tot.google) + (prev ? ' (' + (tot.google >= prev.google ? '▲ +' : '▼ −') + fmt(Math.abs(tot.google - prev.google)) + ')' : ''));
    c6.append(columnChart(d.days, 'google', (r) => [['Всего страниц', r.google], ['Словацкие', r.google_sk], ['Немецкие', r.google_de]]));
    app.append(c6);

    if (tot.leads_pages.length) {
      const c7 = card('С каких страниц заявки'); c7.append(barList(tot.leads_pages)); app.append(c7);
    }
    if (tot.notfound.length) {
      const c8 = card('Не найдено (404)', 'Адреса, по которым посетители получили ошибку — их стоит перенаправить');
      c8.append(barList(tot.notfound)); app.append(c8);
    }
    if (me) app.append(ownCard());        // блок есть только у разработчика (сервер отдаёт его только ему)
  }

  // «Не считать нас»: свой домашний интернет — визиты с него в статистику не попадают
  let me = null;
  function ownCard() {
    const c = card('Не считать нас в статистике',
      'Нажмите дома, подключившись к домашнему Wi-Fi: телефоны и компьютеры дома выходят в интернет с одного адреса. '
      + 'Мобильный интернет не добавляйте — его адрес общий с другими людьми.');
    const box = el('div', 'own'); c.append(box);
    if (!me) { box.append(el('p', 'note', 'Загружаю…')); return c; }
    const now = el('div', 'now'); now.append(document.createTextNode('Вы сейчас в интернете с адреса '), el('b', null, me.ip));
    box.append(now);
    if (me.excluded) box.append(el('div', 'ok', '✓ Этот интернет уже не считается'));
    else {
      const b = el('button', 'btn', 'Не считать этот интернет'); b.type = 'button';
      b.addEventListener('click', () => ownAction({ action: 'add' }, b));
      box.append(b);
      if (me.items.length) box.append(el('p', 'note', 'Если дома этот адрес новый — провайдер мог его сменить (например, после перезагрузки роутера). Нажмите кнопку ещё раз, старый адрес можно убрать.'));
    }
    if (me.items.length) {
      const ul = el('ul');
      me.items.forEach((it) => {
        const li = el('li'); const left = el('div');
        left.append(el('div', null, it.net.replace(/\/32$/, '')),
          el('div', 'meta', [it.who, 'добавлен ' + dshort(it.added), it.seen && it.seen !== it.added ? 'был ' + dshort(it.seen) : ''].filter(Boolean).join(' · ')));
        const rm = el('button', 'btn ghost', 'Убрать'); rm.type = 'button';
        rm.addEventListener('click', () => ownAction({ action: 'remove', net: it.net }, rm));
        li.append(left, rm); ul.append(li);
      });
      box.append(ul);
    }
    return c;
  }
  async function loadMe() {
    try {
      const r = await fetch('/api/stats/me', { headers: { 'X-Telegram-Init-Data': tg.initData }, cache: 'no-store' });
      me = r.ok ? await r.json() : false;
    } catch (e) { me = false; }
  }
  async function ownAction(body, btn) {
    btn.disabled = true;
    try {
      const r = await fetch('/api/stats/exclude', { method: 'POST', cache: 'no-store',
        headers: { 'X-Telegram-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error();
      me = await r.json();
      if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
      await load();                       // цифры пересчитаны без своих визитов
    } catch (e) { btn.disabled = false; btn.textContent = 'Не получилось — ещё раз'; }
  }

  async function load() {
    const init = tg ? tg.initData : '';
    if (!init) {
      app.replaceChildren(el('div', 'err', 'Откройте статистику кнопкой «📈 Графики» в боте студии DUMSKAYA DESIGN.'));
      return;
    }
    app.classList.add('loading');
    try {
      const r = await fetch('/api/stats/data?days=' + days, { headers: { 'X-Telegram-Init-Data': init }, cache: 'no-store' });
      if (r.status === 403) throw new Error('Нет доступа: статистика открыта разработчику и дизайнеру студии.');
      if (r.status === 503) throw new Error('Сервис не может прочитать журнал сайта. Выложите сайт ещё раз — выкладка откроет журнал для чтения.');
      if (!r.ok) throw new Error('Сервер не ответил (' + r.status + '). Попробуйте ещё раз через минуту.');
      data = await r.json();
      if (me === null) await loadMe();
      render();
    } catch (e) {
      app.replaceChildren(el('div', 'err', e.message || String(e)));
    } finally {
      app.classList.remove('loading');
    }
  }

  document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
    days = Number(b.dataset.days);
    document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    load();
  }));
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 150); });
  load();
})();
</script>
</body>
</html>

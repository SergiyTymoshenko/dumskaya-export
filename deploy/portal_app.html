<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DUMSKAYA DESIGN</title>
<!-- Кабинет DUMSKAYA DESIGN («Мой проект» в боте студии): мини-приложение Telegram для заказчика, подрядчика,
     работника подрядчика и наблюдателя «Разработчик ПО». Данные отдаёт сервис заявок (/api/portal/*) — по подписи
     Telegram, только своё (что кому видно — deploy/crm_portal.py). Тексты — RU, UA, EN, SK, DE. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --text-1: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11, 11, 11, 0.10); --series: #1f6bc4; --series-wash: rgba(31, 107, 196, 0.10);
    --up: #006300; --down: #d03b3b; --ghost: rgba(11, 11, 11, 0.05); --warn: #9a5b00; --on-series: #fff;
    --bubble-mine: #1f6bc4; --bubble-other: #ffffff;
    --sab: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
    --k: 1;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --text-1: #f0efec; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.10); --series: #4a93ea; --series-wash: rgba(74, 147, 234, 0.12); --on-series: #0b0b0b;
    --up: #22b422; --down: #e66767; --ghost: rgba(255, 255, 255, 0.06); --warn: #e0a040; --bubble-other: #222221; --bubble-mine: #2a6fc4;
  }
  /* крупный текст (⚙︎ → «Размер текста»): всё в 1,25 или 1,5 раза больше и контрастнее */
  :root[data-size="l"] { --k: 1.25; }
  :root[data-size="xl"] { --k: 1.5; }
  :root[data-size="l"], :root[data-size="xl"] {
    --text-2: #2f2e2b; --muted: #4f4e49; --border: rgba(11, 11, 11, 0.32); --grid: #c4c3ba;
    --series: #1a5cb0; --series-wash: rgba(26, 92, 176, 0.12); --up: #005200; --down: #b42323; --warn: #7a4600; --ghost: rgba(11, 11, 11, 0.08);
    --bubble-mine: #1a5cb0;
  }
  :root[data-theme="dark"][data-size="l"], :root[data-theme="dark"][data-size="xl"] {
    --text-2: #e4e3df; --muted: #bdbcb5; --border: rgba(255, 255, 255, 0.34); --grid: #4a4a45;
    --series: #6aa9f2; --series-wash: rgba(106, 169, 242, 0.16); --up: #4fd14f; --down: #ff8f8f; --warn: #f2bb66; --ghost: rgba(255, 255, 255, 0.10);
    --on-series: #0b0b0b; --bubble-mine: #2f6db8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--page); color: var(--text-1); }
  body { font: calc(17px * var(--k))/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 760px; margin: 0 auto;
    padding: 14px 16px calc(88px + var(--sab)); -webkit-text-size-adjust: 100%; }
  body.no-nav { padding-bottom: calc(24px + var(--sab)); }
  h1 { font-size: calc(24px * var(--k)); font-weight: 650; margin: 2px 0 8px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  h2 { font-size: calc(18px * var(--k)); font-weight: 650; margin: 0 0 10px; }
  .muted { color: var(--text-2); }
  .small { font-size: calc(14px * var(--k)); }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  a { color: var(--series); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin: 0 0 12px; scroll-margin-top: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 10px 16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--raised); cursor: pointer; font-weight: 550; font-size: calc(16px * var(--k)); text-decoration: none; color: inherit; }
  .btn.primary { background: var(--series); border-color: var(--series); color: var(--on-series); }
  .btn.wide { width: 100%; }
  .btn.small { min-height: 40px; padding: 6px 13px; font-size: calc(15px * var(--k)); }
  .btn.danger { color: var(--down); }
  .btn:disabled { opacity: .55; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: calc(15px * var(--k)); cursor: pointer; min-height: 40px; }
  .chip[aria-pressed="true"] { background: var(--text-1); color: var(--page); border-color: var(--text-1); font-weight: 600; }
  .status { display: inline-block; font-size: calc(13px * var(--k)); font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--ghost); color: var(--text-2); white-space: nowrap; }
  .status.ok { color: var(--up); background: rgba(0, 99, 0, 0.10); }
  .status.wait { color: var(--warn); background: rgba(154, 91, 0, 0.12); }
  .status.bad { color: var(--down); background: rgba(208, 59, 59, 0.10); }
  .status.info { color: var(--series); background: var(--series-wash); }
  .hero { font-size: calc(36px * min(var(--k), 1.25)); font-weight: 700; line-height: 1.1; margin: 4px 0 10px; letter-spacing: -0.02em; }
  .sum { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; font-size: calc(17px * var(--k)); }
  .sum dt { color: var(--text-2); }
  .sum dd { margin: 0; font-weight: 700; text-align: right; white-space: nowrap; }
  .owe { color: var(--warn); }
  .good { color: var(--up); }
  .bar { height: 8px; border-radius: 4px; background: var(--ghost); overflow: hidden; margin: 12px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--series); border-radius: 4px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { padding: 12px 0; border-top: 1px solid var(--grid); }
  .list > li:first-child { border-top: 0; padding-top: 4px; }
  .line { display: flex; justify-content: space-between; gap: 4px 12px; align-items: baseline; flex-wrap: wrap; }
  .line b { font-weight: 650; }
  .line .amt { font-weight: 650; white-space: nowrap; margin-left: auto; }
  .sub { font-size: calc(15px * var(--k)); color: var(--text-2); overflow-wrap: anywhere; }
  .icon-btn { width: calc(46px * (1 + (var(--k) - 1) / 2)); height: calc(46px * (1 + (var(--k) - 1) / 2)); border-radius: 12px; border: 1px solid var(--border);
    background: var(--raised); display: inline-flex; align-items: center; justify-content: center; font-size: calc(19px * var(--k)); text-decoration: none; color: inherit; flex: 0 0 auto; cursor: pointer; }
  .contacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .person b { display: block; font-size: calc(18px * var(--k)); overflow-wrap: anywhere; }
  .stage { background: var(--page); border-radius: 12px; padding: 11px 12px; margin: 8px 0 0; }
  .stage .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .order { display: grid; grid-template-columns: calc(84px * min(var(--k), 1.2)) 1fr; gap: 12px; align-items: start; }
  .order .ph { width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--ghost); object-fit: cover; display: block; }
  .order .ph.none { display: flex; align-items: center; justify-content: center; font-size: calc(30px * var(--k)); }
  .charges { list-style: none; margin: 10px 0 0; padding: 0; }
  .charges li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--grid); font-size: calc(15px * var(--k)); flex-wrap: wrap; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grp { font-size: calc(15px * var(--k)); font-weight: 650; margin: 14px 0 8px; }        /* группа (помещение) в «Документах»: h2 под h1 страницы */
  .grp:first-child { margin-top: 0; }
  details.older { margin: 2px 0 8px; }
  details.older summary { cursor: pointer; color: var(--text-2); font-size: calc(14px * var(--k)); padding: 6px 0; min-height: 32px; }
  ol.stages { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
  ol.stages li { display: grid; grid-template-columns: calc(22px * var(--k)) 1fr auto; gap: 8px; align-items: baseline; }
  ol.stages .ic { text-align: center; }
  ol.stages .d { color: var(--text-2); font-size: calc(13px * var(--k)); white-space: nowrap; }
  ol.stages .done { color: var(--text-2); }
  ol.stages .done .ic { color: var(--up); }
  ol.stages .now { font-weight: 650; }
  ol.stages .now .ic { color: var(--series); }
  ol.stages .next { color: var(--muted); }
  .thumb { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--ghost); border: 0; padding: 0; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb { position: relative; }
  .thumb .appr { position: absolute; top: 4px; right: 4px; min-width: calc(24px * var(--k)); height: calc(24px * var(--k)); padding: 0 4px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: calc(13px * var(--k)); font-weight: 700; color: #fff; background: rgba(0,0,0,.6); }
  .thumb .appr-wait { background: var(--warn); color: var(--page); } .thumb .appr-yes { background: var(--up); color: var(--page); }
  .doc { aspect-ratio: 1; border-radius: 10px; background: var(--ghost); border: 0; padding: 8px; cursor: pointer; display: flex; flex-direction: column;
    justify-content: space-between; text-align: left; font-size: calc(12px * var(--k)); overflow: hidden; }
  .doc .ext { font-weight: 700; font-size: calc(13px * var(--k)); color: var(--series); }
  .doc .nm { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--text-2); text-align: center; padding: 26px 8px; }
  .err { color: var(--down); font-size: calc(15px * var(--k)); margin: 0 0 10px; }
  .ver { color: var(--text-2); font-size: calc(12px * min(var(--k), 1.1)); text-align: center; margin: 22px 0 0; overflow-wrap: anywhere; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; justify-content: center; padding: 6px 6px calc(6px + var(--sab)); z-index: 5; }
  .nav .in { display: flex; width: 100%; max-width: 760px; }
  .nav button { flex: 1 1 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; min-width: 0;
    font-size: calc(13px * min(var(--k), 1.15)); color: var(--text-2); padding: 4px 2px; cursor: pointer; min-height: 54px; }
  .nav button span { font-size: calc(22px * min(var(--k), 1.25)); line-height: 1.1; }
  .nav button em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .nav .dot { position: absolute; top: 0; left: calc(50% + 8px); min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--down);
    color: #fff; font-size: 13px; font-weight: 700; line-height: 22px; text-align: center; }
  .nav button[aria-current="page"] { color: var(--series); font-weight: 650; }
  body.typing .nav { display: none; }
  .banner { background: var(--series-wash); border: 1px solid var(--series); border-radius: 14px; padding: 10px 12px; margin: 0 0 12px; font-size: calc(15px * var(--k)); }
  .top { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
  .top .grow { color: var(--text-2); font-size: calc(14px * var(--k)); }
  /* переписка */
  .chat { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
  .msg { max-width: 86%; padding: 9px 12px 7px; border-radius: 16px; background: var(--bubble-other); border: 1px solid var(--border); align-self: flex-start;
    overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: var(--bubble-mine); color: #fff; border-color: transparent; }
  .msg .who { display: block; font-size: calc(13px * var(--k)); font-weight: 650; color: var(--series); margin-bottom: 2px; white-space: normal; }
  .msg .meta { display: block; font-size: calc(12px * var(--k)); opacity: .75; margin-top: 4px; text-align: right; white-space: normal; }
  .msg .orig { display: block; font-size: calc(14px * var(--k)); opacity: .8; border-top: 1px solid currentColor; border-top-color: rgba(127,127,127,.35); margin-top: 6px; padding-top: 5px; }
  .msg button.tr { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; font-size: calc(12px * var(--k)); opacity: .8; cursor: pointer; }
  body.dropping #app { outline: 3px dashed var(--series); outline-offset: -4px; border-radius: 12px; }
  .msg img { display: block; max-width: 100%; max-height: 260px; border-radius: 10px; margin: 2px 0 4px; cursor: pointer; }
  .msg .file { display: inline-flex; gap: 6px; align-items: center; text-decoration: underline; cursor: pointer; }
  .day { align-self: center; font-size: calc(13px * var(--k)); color: var(--text-2); background: var(--ghost); padding: 3px 10px; border-radius: 999px; }
  .composer { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px; display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit; color: inherit; resize: none; min-height: 48px; max-height: 40vh;
    padding: 12px 6px; outline: none; }
  .composer .icon-btn { width: 48px; height: 48px; }
  .composer .send { background: var(--series); color: var(--on-series); border-color: var(--series); }
  /* формы */
  .sheet { position: fixed; inset: 0; background: var(--page); z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet .in { max-width: 760px; margin: 0 auto; padding: 0 16px calc(96px + var(--sab)); }
  .sheet header { position: sticky; top: 0; background: var(--page); display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 0; z-index: 2; border-bottom: 1px solid var(--grid); margin-bottom: 14px; }
  .sheet header h2 { margin: 0; }
  .sheet footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--page); border-top: 1px solid var(--grid); padding: 10px 16px calc(10px + var(--sab)); }
  .sheet footer .in2 { max-width: 728px; margin: 0 auto; display: flex; gap: 8px; }
  .field { margin: 0 0 14px; }
  .field label, .field .lab { display: block; font-size: calc(15px * var(--k)); font-weight: 600; margin: 0 0 6px; }
  .field .hint { font-size: calc(14px * var(--k)); color: var(--text-2); margin-top: 6px; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); background: var(--surface); color: inherit;
    border-radius: 12px; padding: 12px 13px; font: inherit; min-height: 50px; min-width: 0; }
  .field input[type="date"] { -webkit-appearance: none; appearance: none; display: block; text-align: left; }
  .field textarea { min-height: 96px; resize: vertical; }
  .pair { display: grid; grid-template-columns: 1fr calc(110px * var(--k)); gap: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--ghost); padding: 3px; border-radius: 12px; }
  .seg.five { grid-template-columns: repeat(5, 1fr); }
  .seg button { border: 0; background: transparent; border-radius: 9px; min-height: 46px; font-size: calc(15px * var(--k)); cursor: pointer; padding: 4px; }
  .seg button[aria-pressed="true"] { background: var(--raised); font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .toast { position: fixed; left: 50%; bottom: calc(90px + var(--sab)); transform: translateX(-50%); background: var(--text-1); color: var(--page);
    padding: 10px 16px; border-radius: 12px; font-size: calc(15px * var(--k)); z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: 90%; text-align: center; }
  .viewer { position: fixed; inset: 0; background: #0b0b0b; z-index: 20; display: flex; flex-direction: column; }
  .viewer .img { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  .viewer .bar2 { display: flex; gap: 8px; padding: 10px 12px calc(12px + var(--sab)); justify-content: center; flex-wrap: wrap; }
  .viewer .bar2 .btn { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.18); }
  .viewer .cap { color: #ddd; font-size: calc(14px * var(--k)); text-align: center; padding: 10px 12px 0; overflow-wrap: anywhere; }
  /* листание фото раздела: счётчик «3 / 12», стрелки по бокам, свайп пальцем, ← → на компьютере */
  .viewer .img { position: relative; }
  .viewer .pos { color: #fff; font-weight: 700; font-size: calc(15px * var(--k)); text-align: center; padding: 10px 12px 0; font-variant-numeric: tabular-nums; }
  .viewer .pos + .cap { padding-top: 4px; }
  .viewer .vnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 1; width: calc(48px * var(--k)); height: calc(64px * var(--k));
    border-radius: 14px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.5); color: #fff; font-size: calc(34px * var(--k)); line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0 0 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .viewer .vnav.prev { left: 6px; } .viewer .vnav.next { right: 6px; }
  .viewer .vnav:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .viewer img.in-next { animation: vin-next .22s ease-out; } .viewer img.in-prev { animation: vin-prev .22s ease-out; }
  @keyframes vin-next { from { transform: translateX(35%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes vin-prev { from { transform: translateX(-35%); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .viewer img.in-next, .viewer img.in-prev { animation: none; } }
  .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; cursor: pointer; text-align: left; width: 100%; display: block; margin: 0 0 10px; }
  .pcard .title { font-size: calc(19px * var(--k)); font-weight: 650; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .loading { opacity: .55; transition: opacity .2s; }
  :root[data-size="l"] body, :root[data-size="xl"] body { font-weight: 500; line-height: 1.4; }
  :root[data-size="l"] .btn, :root[data-size="xl"] .btn, :root[data-size="l"] .chip, :root[data-size="xl"] .chip,
  :root[data-size="l"] .field input, :root[data-size="xl"] .field input, :root[data-size="l"] .field textarea, :root[data-size="xl"] .field textarea,
  :root[data-size="l"] .field select, :root[data-size="xl"] .field select { border-width: 2px; }
  :root[data-size="l"] .nav button, :root[data-size="xl"] .nav button { color: var(--text-1); }
  :root[data-size="l"] .nav button[aria-current="page"], :root[data-size="xl"] .nav button[aria-current="page"] { color: var(--series); text-decoration: underline; text-underline-offset: 3px; }
  :root[data-size="xl"] .seg.five { grid-template-columns: 1fr 1fr; }
  :root[data-size="xl"] .stage .acts { grid-template-columns: 1fr; }    /* длинные слова на некоторых языках — кнопки друг под другом */
  .btn { min-width: 0; overflow-wrap: break-word; }
  :root[data-size="xl"] .seg.five button:last-child { grid-column: 1 / -1; }
  :root[data-size="xl"] .order { grid-template-columns: 1fr; }
  :root[data-size="xl"] .order .ph { max-width: 160px; }
  :root[data-size="l"] :focus-visible, :root[data-size="xl"] :focus-visible { outline: 3px solid var(--series); outline-offset: 2px; }
  /* разговоры, документы подрядчиков, бригада */
  .threads > li { padding: 0; }
  .trow { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 12px 0; cursor: pointer; min-height: 64px; }
  .trow .ava { width: calc(44px * min(var(--k), 1.25)); height: calc(44px * min(var(--k), 1.25)); border-radius: 50%; background: var(--ghost); display: flex;
    align-items: center; justify-content: center; flex: 0 0 auto; font-size: calc(20px * min(var(--k), 1.25)); }
  .trow b { display: block; font-size: calc(17px * var(--k)); overflow-wrap: anywhere; }
  .trow .sub { display: block; }
  .trow .last { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge-n { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--series); color: var(--on-series); font-size: calc(14px * min(var(--k), 1.2));
    line-height: 26px; text-align: center; flex: 0 0 auto; }
  .drow { display: grid; grid-template-columns: calc(72px * min(var(--k), 1.25)) 1fr; gap: 12px; align-items: start; }
  .tick { width: calc(44px * min(var(--k), 1.3)); height: calc(44px * min(var(--k), 1.3)); border-radius: 12px; border: 2px solid var(--border); background: var(--raised);

  function byRoom(list) {
    const order = (V.rooms || []).map((r) => r[1]);
    list.forEach((f) => { if (f.room && !order.includes(f.room)) order.push(f.room); });
    const groups = order.map((r) => [r, list.filter((f) => f.room === r)]).filter(([, l]) => l.length);
    const rest = list.filter((f) => !f.room);
    if (!groups.length) return gallery(rest);
    const out = el('div'), all = groups.concat(rest.length ? [[T('no_room'), rest]] : []);
    const seq = all.flatMap(([, l]) => l);               // в просмотре фото листаются подряд через все помещения
    all.forEach(([r, l]) => out.append(el('h2', { class: 'grp' }, r + ' · ' + l.length), gallery(l, seq)));
    return out;
  }

    function drawComposer() {
      composer.replaceChildren();
      dropTo = null;
      if (ro) { composer.append(el('p', { class: 'small muted', style: 'text-align:center' }, '👁 ' + T('read_only'))); return; }
      const ta = el('textarea', { rows: 1, placeholder: T('placeholder'), 'aria-label': T('placeholder') });
      const file = el('input', { type: 'file', multiple: true, style: 'display:none' });
      const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, window.innerHeight * 0.4) + 'px'; };
      ta.addEventListener('input', grow);
      ta.addEventListener('focus', () => document.body.classList.add('typing'));
      ta.addEventListener('blur', () => setTimeout(() => document.body.classList.remove('typing'), 150));
      const doSend = async (fileId) => {
        const text = ta.value.trim();
        if (!text && !fileId) return;
        sending = true;
        try { await api('/api/portal/chat', { json: { thread_id: TID, text, file_id: fileId || null } }); ta.value = ''; grow(); }
        catch (e) { toast(e.message); }
        finally { sending = false; }
        await refreshChat(true);
      };
      let queue = Promise.resolve();        // сообщения и файлы уходят по очереди — ни одно не теряется
      const send = (fileId) => (queue = queue.then(() => doSend(fileId)));
      const attach = async (list) => {
        const fs = [...(list || [])].map(named);
        for (const f of fs) {
          if (f.size > 20 * 1024 * 1024) { toast(T('too_big')); continue; }
          const tt = el('div', 'toast', T('uploading')); document.body.append(tt);
          try {
            const r = await api('/api/portal/upload?thread=' + TID + '&name=' + encodeURIComponent(f.name || 'file'), { body: f, headers: { 'Content-Type': f.type || 'application/octet-stream' } });
            tt.remove(); await send(r.id);
          } catch (e) { tt.remove(); toast(e.code === 'file_too_big' ? T('too_big') : e.message); }
        }
      };
      file.addEventListener('change', async () => { const fs = [...file.files]; file.value = ''; await attach(fs); });
      ta.addEventListener('keydown', (e) => {       // компьютер: Enter — отправить, Shift+Enter — новая строка; везде ⌘/Ctrl+Enter
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && (DESKTOP || e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
      });
      dropTo = attach;
      composer.append(el('div', 'composer', el('button', { class: 'icon-btn', type: 'button', title: T('attach'), 'aria-label': T('attach'), onclick: () => file.click() }, '📎'), ta, file,
        el('button', { class: 'icon-btn send', type: 'button', title: T('send'), 'aria-label': T('send'), onclick: () => send() }, '➤')));
    }
    async function refreshChat(scroll) {
      try {
        const after = CHAT.length ? CHAT[CHAT.length - 1].id : 0;
        const r = await api('/api/portal/chat?' + pq({ thread: TID, after }).toString());
        const fresh = r.messages || [];
        if (!after) {
          const nro = readonly() || r.readonly;
          if (nro !== ro) { ro = nro; drawComposer(); }
          const ti = (TH || []).find((x) => x.id === TID);
          if (ti) ti.unread = 0; else if (r.thread) (TH = TH || []).push(Object.assign(r.thread, { unread: 0 }));
        }
        if (fresh.length || !after) {
          const near = window.innerHeight + window.scrollY > document.body.scrollHeight - 160;
          CHAT = after ? CHAT.concat(fresh) : fresh;
          draw(); setNav();
          if (scroll || near || !after) scrollDown();
        }
      } catch (e) { if (!CHAT.length) box.replaceChildren(el('p', 'err', e.message)); }
    }
    CHAT = []; draw(); drawComposer(); refreshChat(true);
    chatTimer = setInterval(() => { if (!document.hidden && tab === 'chat' && TID) refreshChat(false); }, 8000);
  }

    P.clients.forEach((c) => ul.append(el('li', null, el('b', null, c.name), el('div', 'sub', T('client') + ' · ' + (c.tg ? T('connected') : T('not_connected'))))));
    P.contractors.forEach((c) => {
      const li = el('li', null, el('b', null, c.name), el('div', 'sub', [T(c.kind === 'supplier' ? 'role_supplier' : c.kind === 'hired' ? 'role_hired' : 'role_contractor'), c.trade, c.company,
        c.tg ? T('connected') : T('not_connected')].filter(Boolean).join(' · ')));
      c.crew.filter((w) => w.assigned).forEach((w) => li.append(el('div', { class: 'sub', style: 'padding-left:14px' }, '└ ' + w.name + (w.position ? ' · ' + w.position : '') + ' · ' + (w.tg ? T('connected') : T('not_connected')))));
      ul.append(li);
    });
    box.append(ul);
    return box;
  }
  function homeAssistant() {
    app.append(topBar(), headCard());
    const un = unreadAll();
    if (un) app.append(el('button', { class: 'pcard', type: 'button', style: 'border-color:var(--series)', onclick: () => go('chat') },
      el('div', { class: 'title', style: 'color:var(--series)' }, '💬 ' + T('new_msgs') + ' · ' + un)));
    const n = (V.files || []).length;
    app.append(el('button', { class: 'pcard', type: 'button', onclick: () => go('docs') }, el('div', 'small muted', T('nav_docs')),
      el('div', 'title', '📄 ' + n), el('div', 'sub', T('details') + ' →')));
    app.append(participantsCard());
    app.append(studioCard());
    if (!(LANG === 'ru' || LANG === 'uk')) app.append(el('p', { class: 'small muted', style: 'text-align:center' }, T('auto_names')));
  }

  // ---------- наблюдатель: участники и «посмотреть глазами» ----------
  function homeObserver() {
    app.append(topBar(), headCard());
    app.append(participantsCard());
    const pv = (q) => { location.href = '/api/portal/app?' + new URLSearchParams(Object.assign({ project: PID }, q)).toString(); };
    const L = V.preview_links || { contractors: [], crew: [] };
    app.append(el('section', 'card', el('h2', null, T('see_as')), el('div', 'pick',
      el('button', { class: 'btn', type: 'button', onclick: () => pv({ preview: 'client' }) }, '👁 ' + T('client')),
      ...L.contractors.map((c) => el('button', { class: 'btn', type: 'button', onclick: () => pv({ preview: 'contractor', link: c.link }) }, '👁 ' + c.name + (c.trade ? ' · ' + c.trade : ''))),
      ...L.crew.map((w) => el('button', { class: 'btn', type: 'button', onclick: () => pv({ preview: 'worker', crew: w.id }) }, '👁 ' + w.name + (w.position ? ' · ' + w.position : ''))))));
  }

  // ---------- формы ----------
  const MB = tg && tg.MainButton && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1') ? tg.MainButton : null;
  function syncSheets() {
    const top = sheets[sheets.length - 1];
    if (MB) {
      const css = getComputedStyle(document.documentElement);
      try { if (top && top.run) MB.setParams({ text: top.label, color: css.getPropertyValue('--series').trim(), text_color: css.getPropertyValue('--on-series').trim(), is_active: true, is_visible: true }); else MB.hide(); } catch (e) {}
    }
    backBtn();
  }
  if (MB) MB.onClick(() => { const top = sheets[sheets.length - 1]; if (top && top.run) top.run(); });
  function closeSheet(sh) { const i = sheets.findIndex((x) => x.el === sh); if (i >= 0) sheets.splice(i, 1); sh.remove(); syncSheets(); }
  function sheet(title, body, onSave, saveLabel) {
    const err = el('p', 'err', ''); err.hidden = true;
    const sh = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }), inner = el('div', 'in');   // форма поверх страницы — окно
    inner.append(el('header', null, el('h2', null, title), el('button', { class: 'btn small', type: 'button', onclick: () => closeSheet(sh) }, T('close'))), err, body);
    sh.append(inner);
    const rec = { el: sh, label: saveLabel || T('save'), run: null };
    let busy = false, btn = null;
    if (onSave) rec.run = async () => {
      if (busy) return; busy = true; err.hidden = true; if (btn) btn.disabled = true;
      if (MB) try { MB.showProgress(false); } catch (e) {}
      try { await onSave(); closeSheet(sh); }
      catch (e) { err.textContent = e.message; err.hidden = false; sh.scrollTo(0, 0); }
      finally { busy = false; if (btn) btn.disabled = false; if (MB) try { MB.hideProgress(); } catch (e) {} }
    };
    if (onSave && !MB) { btn = el('button', { class: 'btn primary', type: 'button', style: 'flex:1', onclick: () => rec.run() }, rec.label); sh.append(el('footer', null, el('div', 'in2', btn))); }
    else inner.style.paddingBottom = 'calc(28px + var(--sab))';
    document.body.append(sh); sheets.push(rec); syncSheets();
    return sh;
  }
  const field = (label, input, hint) => el('div', 'field', el('label', null, label), input, hint ? el('div', 'hint', hint) : null);
  // язык кабинета — список всех языков на их же языке; на выбранный язык переводятся разговоры и названия
  function langSheet() {
    const list = el('div', 'pick langs');
    const cur = LANGS.filter((x) => x[0] === LANG), rest = LANGS.filter((x) => x[0] !== LANG);      // выбранный — первым
    cur.concat(rest).forEach(([k, n]) => list.append(el('button', { class: 'btn' + (k === LANG ? ' primary' : ''), type: 'button', lang: k, 'aria-pressed': String(k === LANG),
      onclick: () => setLang(k) }, (k === LANG ? '✓ ' : '') + n)));
    sheet(T('language'), el('div', el('p', 'small muted', T('lang_hint')), list));
  }
  async function setLang(k) {
    const t = el('div', 'toast', '…'); document.body.append(t);
    try { await loadLang(k); } finally { t.remove(); }
    LANG = k; document.documentElement.lang = k;
    if (!PREVIEW) { try { await api('/api/portal/ui', { json: { lang: k } }); } catch (e) {} }
    closeSheets();
    if (PID) await openProject(PID, V && V.roles && V.roles.length > 1 ? role() : null, tab, TID); else render();
  }
  function settingsSheet() {
    const langSeg = el('div'), sizeSeg = el('div', 'seg');
    const draw = () => {
      langSeg.replaceChildren(el('button', { class: 'btn wide', type: 'button', onclick: langSheet }, '🌐 ' + langName(LANG) + ' →'));
      sizeSeg.replaceChildren(...[['m', T('size_m')], ['l', T('size_l')], ['xl', T('size_xl')]].map(([k, n]) => el('button', { type: 'button',
        'aria-pressed': String((document.documentElement.dataset.size || 'm') === k), onclick: async () => {
          applySize(k); draw(); render(); syncSheets(); if (!PREVIEW) { try { await api('/api/portal/ui', { json: { size: k } }); } catch (e) {} } } }, n)));
    };
    draw();
    sheet(T('settings'), el('div', el('div', 'field', el('span', 'lab', T('language')), langSeg, el('div', 'hint', T('lang_hint'))),
      el('div', 'field', el('span', 'lab', T('text_size')), sizeSeg)));
  }
  function closeSheets() { sheets.splice(0).forEach((x) => x.el.remove()); syncSheets(); }

  // ---------- старт ----------
  async function start() {
    if (!INIT) { app.replaceChildren(el('div', 'card muted', T('open_from_bot'))); return; }
    app.replaceChildren(el('p', 'empty', T('loading')));
    try { [ME] = await Promise.all([api('/api/portal/me'), loadLang(LANG)]); }
    catch (e) { return fail(e); }
    if (ME.langs && ME.langs.length) LANGS = ME.langs;
    if (!PREVIEW) LANG = ME.lang || LANG;
    await loadLang(LANG);
    if (ME.size) applySize(ME.size);
    document.documentElement.lang = LANG;
    const want = Number(Q.get('project') || 0);
    if (PREVIEW && want) return openProject(want, null, Q.get('tab'), Q.get('thread'));
    if (Q.get('team') && (ME.heads || []).length) return openTeam(ME.heads[0].id);
    const p = ME.projects.find((x) => x.id === want) || (ME.projects.length === 1 ? ME.projects[0] : null);
    if (p) return openProject(p.id, p.roles[0], Q.get('tab'), Q.get('thread'));
    render();
  }
  start();
})();
</script>
</body>
</html>

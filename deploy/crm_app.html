<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Студия</title>
<!-- «Студия» — учёт проектов DUMSKAYA DESIGN: мини-приложение Telegram (кнопка «Студия» в боте).
     Данные отдаёт сервис заявок (/api/crm/*) только разработчику и дизайнеру — по подписи Telegram. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --text-1: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10); --series: #2a78d6; --series-wash: rgba(42, 120, 214, 0.10);
    --up: #006300; --down: #d03b3b; --ghost: rgba(11, 11, 11, 0.05); --warn: #9a5b00;
    --sab: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));   /* полоска «домой» на iPhone */
    --k: 1;                                 /* размер текста: 1 — обычный; крупный и очень крупный — ниже */
    --on-series: #fff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --text-1: #f0efec; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10); --series: #3987e5; --series-wash: rgba(57, 135, 229, 0.12);
    --up: #0ca30c; --down: #e66767; --ghost: rgba(255, 255, 255, 0.06); --warn: #e0a040;
  }
  /* Крупный текст (⚙︎ → «Размер текста»; у дизайнера по умолчанию «Крупный»): весь текст в 1,25 или 1,5 раза больше,
     второстепенный текст и рамки — контрастнее (не светло-серые), поля ввода и кнопки — заметнее. */
  :root[data-size="l"] { --k: 1.25; }
  :root[data-size="xl"] { --k: 1.5; }
  :root[data-size="l"], :root[data-size="xl"] {
    --text-2: #2f2e2b; --muted: #4f4e49; --border: rgba(11, 11, 11, 0.32); --grid: #c4c3ba; --axis: #8f8e86;
    --series: #1a5cb0; --series-wash: rgba(26, 92, 176, 0.12); --up: #005200; --down: #b42323; --warn: #7a4600; --ghost: rgba(11, 11, 11, 0.08);
  }
  :root[data-theme="dark"][data-size="l"], :root[data-theme="dark"][data-size="xl"] {
    --text-2: #e4e3df; --muted: #bdbcb5; --border: rgba(255, 255, 255, 0.34); --grid: #4a4a45; --axis: #6a6a64;
    --series: #6aa9f2; --series-wash: rgba(106, 169, 242, 0.16); --up: #4fd14f; --down: #ff8f8f; --warn: #f2bb66; --ghost: rgba(255, 255, 255, 0.10);
    --on-series: #0b0b0b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--page); color: var(--text-1); }
  body { font: calc(17px * var(--k))/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 760px; margin: 0 auto;
    padding: 14px 16px calc(88px + var(--sab)); -webkit-text-size-adjust: 100%; }
  h1 { font-size: calc(24px * var(--k)); font-weight: 650; margin: 2px 0 12px; letter-spacing: -0.01em; }
  h2 { font-size: calc(17px * var(--k)); font-weight: 650; margin: 0 0 10px; }
  .muted { color: var(--text-2); }
  .small { font-size: calc(14px * var(--k)); }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  a { color: var(--series); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin: 0 0 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 10px 16px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--raised); cursor: pointer; font-weight: 550; font-size: calc(16px * var(--k)); }
  .btn.primary { background: var(--series); border-color: var(--series); color: var(--on-series); }
  .btn.wide { width: 100%; }
  .btn.danger { color: var(--down); }
  .btn.small { min-height: 40px; padding: 6px 13px; font-size: calc(15px * var(--k)); }
  .btn:disabled { opacity: .55; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: calc(15px * var(--k)); cursor: pointer; min-height: 40px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--text-1); color: var(--page); border-color: var(--text-1); font-weight: 600; }
  .search { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px; font: inherit; color: inherit; margin: 0 0 10px; min-height: 48px; }
  .status { display: inline-block; font-size: calc(12px * var(--k)); font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--ghost); color: var(--text-2); white-space: nowrap; }
  .status.active { color: var(--series); background: var(--series-wash); }
  .status.done { color: var(--up); }
  .status.cancelled { color: var(--muted); text-decoration: line-through; }
  .plist { display: grid; gap: 10px; }
  .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 13px 14px; cursor: pointer; text-align: left; width: 100%; }
  .pcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: calc(13px * var(--k)); color: var(--text-2); }
  .pcard .title { font-size: calc(18px * var(--k)); font-weight: 650; margin: 3px 0 2px; overflow-wrap: anywhere; }
  .pcard .sub { font-size: calc(15px * var(--k)); color: var(--text-2); }
  .bar { height: 8px; border-radius: 4px; background: var(--ghost); overflow: hidden; margin: 10px 0 6px; }
  .bar i { display: block; height: 100%; background: var(--series); border-radius: 4px; }
  .money { display: flex; justify-content: space-between; gap: 8px; font-size: calc(15px * var(--k)); flex-wrap: wrap; }
  .money b { font-weight: 650; }
  .owe { color: var(--warn); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 4px; }
  .tile { background: var(--page); border-radius: 12px; padding: 10px; min-width: 0; }
  .tile .l { font-size: calc(12px * var(--k)); color: var(--text-2); }
  .tile .v { font-size: calc(19px * var(--k)); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; margin: 0; font-size: calc(17px * var(--k)); }
  .sum dt { color: var(--text-2); }
  .sum dd { margin: 0; font-weight: 700; text-align: right; white-space: nowrap; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .actions .btn { padding: 8px 6px; font-size: calc(15px * var(--k)); flex-direction: column; gap: 3px; min-height: 64px; }
  .actions .btn span { font-size: calc(21px * var(--k)); line-height: 1; }
  .ops { list-style: none; margin: 0; padding: 0; }
  .ops li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 0; border-top: 1px solid var(--grid); cursor: pointer; }
  .ops li:first-child { border-top: 0; }
  .ops .what { font-weight: 600; font-size: calc(16px * var(--k)); overflow-wrap: anywhere; }
  .ops .meta { font-size: calc(14px * var(--k)); color: var(--text-2); grid-column: 1 / -1; overflow-wrap: anywhere; }
  .ops .amt { font-weight: 650; white-space: nowrap; text-align: right; }
  .ops .amt.plus { color: var(--up); }
  .tabs { display: flex; gap: 4px; background: var(--ghost); padding: 3px; border-radius: 12px; margin: 0 0 10px; }
  .tabs button { flex: 1 1 0; border: 0; background: transparent; padding: 9px 2px; border-radius: 9px; font-size: calc(15px * min(var(--k), 1.15)); cursor: pointer; min-width: 0; white-space: nowrap; min-height: 42px; }
  .tabs button[aria-pressed="true"] { background: var(--raised); font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .thumb { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--ghost); border: 0; padding: 0; cursor: pointer; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .doc { aspect-ratio: 1; border-radius: 10px; background: var(--ghost); border: 0; padding: 8px; cursor: pointer; display: flex; flex-direction: column;
    justify-content: space-between; text-align: left; font-size: calc(12px * var(--k)); overflow: hidden; }
  .doc .ext { font-weight: 700; font-size: calc(13px * var(--k)); color: var(--series); }
  .doc .nm { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .people { list-style: none; margin: 0; padding: 0; }
  .people li { padding: 11px 0; border-top: 1px solid var(--grid); display: flex; gap: 10px; align-items: center; }
  .people li:first-child { border-top: 0; }
  .people .who { flex: 1 1 auto; min-width: 0; cursor: pointer; }
  .people .who b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .people .who span { font-size: calc(14px * var(--k)); color: var(--text-2); }
  .icon-btn { width: calc(44px * (1 + (var(--k) - 1) / 2)); height: calc(44px * (1 + (var(--k) - 1) / 2)); border-radius: 12px; border: 1px solid var(--border); background: var(--raised); display: inline-flex;
    align-items: center; justify-content: center; font-size: calc(18px * var(--k)); text-decoration: none; color: inherit; flex: 0 0 auto; cursor: pointer; }
  .kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 6px 12px; font-size: calc(16px * var(--k)); }
  .kv dt { color: var(--text-2); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .empty { color: var(--text-2); text-align: center; padding: 26px 8px; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; justify-content: center; padding: 6px 6px calc(6px + var(--sab)); z-index: 5; }
  .nav .in { display: flex; width: 100%; max-width: 760px; }
  .nav button { flex: 1 1 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; min-width: 0;
    font-size: calc(13px * min(var(--k), 1.15)); color: var(--text-2); padding: 4px; cursor: pointer; min-height: 52px; }
  .nav button span { font-size: calc(22px * min(var(--k), 1.25)); line-height: 1.1; }
  .nav .dot { position: absolute; top: 0; left: calc(50% + 8px); min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--down);
    color: #fff; font-size: 13px; font-weight: 700; line-height: 22px; text-align: center; }
  .nav button[aria-current="page"] { color: var(--series); font-weight: 650; }
  /* формы */
  .sheet { position: fixed; inset: 0; background: var(--page); z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet .in { max-width: 760px; margin: 0 auto; padding: 0 16px calc(96px + var(--sab)); }
  .sheet header { position: sticky; top: 0; background: var(--page); display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 0; z-index: 2; border-bottom: 1px solid var(--grid); margin-bottom: 14px; }
  .sheet header h2 { margin: 0; font-size: calc(18px * var(--k)); }
  .sheet footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--page); border-top: 1px solid var(--grid);
    padding: 10px 16px calc(10px + var(--sab)); }
  .sheet footer .in2 { max-width: 728px; margin: 0 auto; display: flex; gap: 8px; }
  .field { margin: 0 0 14px; }
  .field label, .field .lab { display: block; font-size: calc(15px * var(--k)); font-weight: 600; margin: 0 0 6px; }
  .field .hint { font-size: calc(14px * var(--k)); color: var(--text-2); margin-top: 6px; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); background: var(--surface); color: inherit;
    border-radius: 12px; padding: 12px 13px; font: inherit; min-height: 50px; }
  .field input[type="date"] { -webkit-appearance: none; appearance: none; display: block; text-align: left; }
  .field input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--series); outline-offset: -1px; }
  .pair { display: grid; grid-template-columns: 1fr calc(118px * var(--k)); gap: 8px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two > *, .pair > * { min-width: 0; }
  .field input { min-width: 0; }
  .rate { font-size: calc(14px * var(--k)); color: var(--text-2); margin-top: 6px; }
  .rate b { color: var(--text-1); }
  .check, .field label.check { display: flex; align-items: center; gap: 10px; font-size: calc(15px * var(--k)); font-weight: 400; margin: 10px 0 0; min-height: 32px; }
  .check input, .field .check input { width: 22px; height: 22px; min-height: 0; flex: 0 0 auto; }
  .err { color: var(--down); font-size: calc(14px * var(--k)); margin: 0 0 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + var(--sab)); transform: translateX(-50%); background: var(--text-1); color: var(--page);
    padding: 10px 16px; border-radius: 12px; font-size: calc(14px * var(--k)); z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: 90%; text-align: center; }
  .viewer { position: fixed; inset: 0; background: #0b0b0b; z-index: 20; display: flex; flex-direction: column; }
  .viewer .img { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  .viewer .bar2 { display: flex; gap: 8px; padding: 10px 12px calc(12px + var(--sab)); flex-wrap: wrap; justify-content: center; }
  .viewer .bar2 .btn { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.18); }
  .viewer .cap { color: #ddd; font-size: calc(13px * var(--k)); text-align: center; padding: 10px 12px 0; overflow-wrap: anywhere; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--muted); font-size: calc(11px * var(--k)); font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
    font-size: calc(13px * var(--k)); box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 160px; display: none; z-index: 2; }
  .tip .d { color: var(--text-2); margin-bottom: 4px; }
  .tip .r { display: flex; justify-content: space-between; gap: 10px; }
  .bars { display: grid; gap: 8px; }
  .hb { display: grid; grid-template-columns: minmax(84px, 36%) 1fr; gap: 10px; align-items: center; font-size: calc(14px * var(--k)); }
  .hb .track { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hb .fill { height: 12px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hb .n { color: var(--text-2); font-size: calc(13px * var(--k)); white-space: nowrap; }
  .hero { font-size: calc(40px * min(var(--k), 1.25)); font-weight: 700; line-height: 1.1; margin: 2px 0 6px; letter-spacing: -0.02em; }
  details summary { cursor: pointer; color: var(--text-2); font-size: calc(14px * var(--k)); }
  .loading { opacity: .55; transition: opacity .2s; }
  .pick { display: grid; gap: 8px; }
  .pick button { text-align: left; }
  .card { scroll-margin-top: 10px; }
  /* заявки и доступ к боту */
  .pcard.lead.new { border-color: var(--series); box-shadow: inset 4px 0 0 var(--series); }
  .pcard .snip { font-size: calc(15px * var(--k)); color: var(--text-2); margin-top: 4px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .status.new { color: #fff; background: var(--series); }
  .status.work { color: var(--warn); background: rgba(154, 91, 0, 0.12); }
  .status.project { color: var(--up); background: rgba(0, 99, 0, 0.10); }
  .status.closed { color: var(--text-2); }
  .status.spam { color: var(--down); background: rgba(208, 59, 59, 0.10); }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .seg.seg2 { grid-template-columns: 1fr 1fr; }
  .seg.seg2 button:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .btn[aria-pressed="true"] { border-color: var(--series); background: var(--series-wash); font-weight: 650; }
  /* подрядчики проекта: этапы и бонусы */
  .kcard { border-top: 1px solid var(--grid); padding: 14px 0 4px; margin-top: 12px; }
  .stages { list-style: none; margin: 10px 0 0; padding: 0; }
  .stages li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; background: var(--page); border-radius: 12px; margin: 0 0 6px; cursor: pointer; }
  .stages .t { font-weight: 600; overflow-wrap: anywhere; }
  .stages .a { font-weight: 650; white-space: nowrap; text-align: right; }
  .stages .m { grid-column: 1 / -1; font-size: calc(14px * var(--k)); color: var(--text-2); overflow-wrap: anywhere; }
  .debt { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 10px; margin: 8px 0 2px; flex-wrap: wrap; }
  .debt b { font-size: calc(19px * var(--k)); white-space: nowrap; }
  .kactions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--ghost); padding: 3px; border-radius: 12px; }
  .seg button { border: 0; background: transparent; border-radius: 9px; min-height: 44px; font-size: calc(15px * var(--k)); cursor: pointer; padding: 4px; }
  .seg button[aria-pressed="true"] { background: var(--raised); font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .jump { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px; scrollbar-width: none; }
  .jump::-webkit-scrollbar { display: none; }
  .badge { font-weight: 650; white-space: nowrap; font-size: calc(15px * var(--k)); }
  .drop { outline: 2px dashed var(--series); outline-offset: -6px; }
  .dnd-hint { display: none; }
  @media (hover: hover) and (pointer: fine) { .dnd-hint { display: block; } }
  /* крупный текст: раскладка, чтобы ничего не обрезалось */
  :root[data-size="l"] body, :root[data-size="xl"] body { font-weight: 500; line-height: 1.4; }
  :root[data-size="l"] .actions, :root[data-size="xl"] .actions { grid-template-columns: 1fr; }
  :root[data-size="l"] .actions .btn, :root[data-size="xl"] .actions .btn { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 16px; min-height: 58px; }
  :root[data-size="xl"] .kactions, :root[data-size="xl"] .two { grid-template-columns: 1fr; }
  :root[data-size="xl"] .two { gap: 0; }
  :root[data-size="l"] .hb, :root[data-size="xl"] .hb { grid-template-columns: 1fr; gap: 4px; }
  :root[data-size="xl"] .kv { grid-template-columns: 1fr; gap: 0; }
  :root[data-size="xl"] .kv dd { margin-bottom: 8px; }
  :root[data-size="l"] .field input, :root[data-size="l"] .field select, :root[data-size="l"] .field textarea, :root[data-size="l"] .search,
  :root[data-size="xl"] .field input, :root[data-size="xl"] .field select, :root[data-size="xl"] .field textarea, :root[data-size="xl"] .search { border-width: 2px; }
  :root[data-size="l"] ::placeholder, :root[data-size="xl"] ::placeholder { color: var(--muted); opacity: 1; }
  :root[data-size="l"] .chip, :root[data-size="xl"] .chip, :root[data-size="l"] .btn, :root[data-size="xl"] .btn { border-width: 2px; }
  :root[data-size="l"] .nav button, :root[data-size="xl"] .nav button { color: var(--text-1); }
  :root[data-size="l"] .nav button[aria-current="page"], :root[data-size="xl"] .nav button[aria-current="page"] { color: var(--series); text-decoration: underline; text-underline-offset: 3px; }
  :root[data-size="l"] .seg button, :root[data-size="xl"] .seg button { min-height: 52px; }
  :root[data-size="l"] :focus-visible, :root[data-size="xl"] :focus-visible { outline: 3px solid var(--series); outline-offset: 2px; }
</style>
</head>
<body>
<main id="app"><p class="empty">Загружаю…</p></main>
<nav class="nav" id="nav"><div class="in">
  <button type="button" data-tab="leads"><span>📋</span>Заявки<b class="dot" id="leads-dot" hidden></b></button>
  <button type="button" data-tab="projects"><span>📁</span>Проекты</button>
  <button type="button" data-tab="money"><span>💶</span>Деньги</button>
  <button type="button" data-tab="people"><span>👥</span>Контакты</button>
  <button type="button" data-tab="charts"><span>📈</span>Сайт</button>
</div></nav>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const INIT = tg ? tg.initData : '';
  const app = document.getElementById('app');
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const MON = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  let S = null, P = null, tab = 'projects', view = 'list', filter = 'work', query = '', fileTab = 'measure', peopleTab = 'clients', period = 'month', M = null, lastPid = null;
  let L = null, LS = null, A = null, leadFilter = 'new', leadQuery = '';   // заявка, список заявок, доступ к боту
  const sheets = [];                        // открытые формы и карточки поверх страницы, последняя — сверху

  // ---------- оформление ----------
  function theme() {
    const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (tg) { try { const bg = dark ? '#0d0d0d' : '#f9f9f7'; tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {} }
  }
  // размер текста: свой у каждого (хранится на сервере, у дизайнера по умолчанию «Крупный»); на этом устройстве помним,
  // чтобы при открытии сразу показать нужный размер
  const SIZES = [['m', 'Обычный'], ['l', 'Крупный'], ['xl', 'Очень крупный']];
  function applySize(z) {
    if (!SIZES.some((x) => x[0] === z)) return;
    document.documentElement.dataset.size = z;
    try { localStorage.setItem('ui-size', z); } catch (e) {}
  }
  try { applySize(localStorage.getItem('ui-size')); } catch (e) {}
  const K = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k')) || 1;
  if (tg) {
    tg.ready(); tg.expand(); tg.onEvent('themeChanged', () => { theme(); syncSheets(); });
    // на iPhone свайп вниз по странице не сворачивает «Студию» — листать формы можно спокойно
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  }
  theme();

  // ---------- мелочи ----------
  const el = (tag, attrs, ...kids) => {
    if (attrs && (attrs.nodeType || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }   // el('div', дочерний, …)
    const n = document.createElement(tag);
    if (typeof attrs === 'string') n.className = attrs;
    else if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const NB = ' ';
  const SYM = { EUR: '€', USD: '$', UAH: '₴', CZK: 'Kč', PLN: 'zł', GBP: '£', CHF: 'CHF', HUF: 'Ft', AED: 'AED' };
  function num(x, digits) {
    const dg = digits == null ? 2 : digits, k = Math.pow(10, dg);
    const v = Math.round((x || 0) * k) / k;
    const [i, f] = Math.abs(v).toFixed(dg).split('.');
    const s = i.replace(/\B(?=(\d{3})+(?!\d))/g, NB) + (f && Number(f) ? ',' + f : '');
    return (v < 0 ? '−' : '') + s;
  }
  const eur = (x) => num(x) + NB + '€';
  const money = (x, c) => num(x) + NB + (SYM[c] || c);
  const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const dfmt = (s) => { if (!s) return ''; const d = pd(s.slice(0, 10)); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const status = (s) => (S.lists.statuses.find((x) => x[0] === s) || [s, s])[1];
  const plural = (n, a, b, c) => { const x = Math.abs(n) % 100, y = x % 10; return x > 10 && x < 20 ? c : y === 1 ? a : y >= 2 && y <= 4 ? b : c; };
  function toast(text) {
    const t = el('div', 'toast', text); document.body.append(t);
    if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    setTimeout(() => t.remove(), 2200);
  }
  function confirmBox(text) {
    return new Promise((ok) => { if (tg && tg.showConfirm) { try { return tg.showConfirm(text, ok); } catch (e) {} } ok(window.confirm(text)); });
  }
  async function api(path, opts) {
    const o = opts || {};
    const headers = { 'X-Telegram-Init-Data': INIT };
    if (o.json) headers['Content-Type'] = 'application/json';
    Object.assign(headers, o.headers || {});
    const r = await fetch(path, { method: o.method || (o.json || o.body ? 'POST' : 'GET'), headers, body: o.json ? JSON.stringify(o.json) : o.body, cache: 'no-store' });
    let data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((data && data.error) || ('Сервер не ответил (' + r.status + ')'));
    return data;
  }
  const save = (entity, data) => api('/api/crm/save', { json: { entity, data } });
  const absUrl = (u) => new URL(u, location.href).href;
  const srcText = (s) => (s || '').replace(/(\d{4})-(\d{2})-(\d{2})/, '$3.$2.$1');
  function openLink(u) { if (tg && tg.openLink) tg.openLink(absUrl(u)); else window.open(u, '_blank'); }
  const digits = (s) => (s || '').replace(/[^\d+]/g, '');
  const parseNum = (v) => parseFloat(String(v == null ? '' : v).replace(/[\s\u00a0]/g, '').replace(',', '.'));
  const curMoney = (x, c) => (!c || c === 'EUR' ? eur(x) : money(x, c));
  const pctText = (x) => num(x, 2) + NB + '%';
  const fsize = (b) => (!b ? '' : b < 1048576 ? Math.max(1, Math.round(b / 1024)) + NB + 'КБ' : num(b / 1048576, 1) + NB + 'МБ');

  // ---------- навигация ----------
  const stack = [];
  function go(v, push) {
    if (push !== false) stack.push({ tab, view, pid: P && P.project.id });
    view = v; render(); window.scrollTo(0, 0); backBtn();
  }
  function back() {
    const prev = stack.pop();
    if (!prev) return;
    tab = prev.tab; view = prev.view; render(); backBtn();
  }
  function backBtn() {
    if (!tg || !tg.BackButton) return;
    if (stack.length || sheets.length || document.querySelector('.viewer')) tg.BackButton.show(); else tg.BackButton.hide();
  }
  function closeViewer(v) { v.remove(); backBtn(); }
  if (tg && tg.BackButton) tg.BackButton.onClick(() => {
    const v = document.querySelector('.viewer');
    if (v) return closeViewer(v);
    if (sheets.length) return closeSheet(sheets[sheets.length - 1].el);
    back();
  });
  document.addEventListener('keydown', (e) => {          // на компьютере: Esc — закрыть просмотр, ⌘/Ctrl+Enter — сохранить форму
    const top = sheets[sheets.length - 1], v = document.querySelector('.viewer');
    if (e.key === 'Escape') { if (v) closeViewer(v); else if (top && !top.run) closeSheet(top.el); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && top && top.run) { e.preventDefault(); top.run(); }
  });
  document.querySelectorAll('.nav button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.tab === 'charts') { location.href = '/api/stats/app'; return; }
    tab = b.dataset.tab; view = 'list'; stack.length = 0;
    if (tab === 'leads') LS = null;                       // список заявок — всегда свежий
    if (tab === 'people' && peopleTab === 'access') A = null;
    render(); window.scrollTo(0, 0); backBtn();
  }));
  function markNav() {
    document.querySelectorAll('.nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
    const dot = document.getElementById('leads-dot'), n = S ? S.leads_new || 0 : 0;   // новые заявки — число на вкладке
    dot.hidden = !n; dot.textContent = n > 99 ? '99+' : String(n);
  }

  // ---------- загрузка ----------
  async function loadState() { S = await api('/api/crm/state'); }
  async function openProject(id, push) {
    app.classList.add('loading');
    try {
      P = await api('/api/crm/project?id=' + id);
      if (P.project.id !== lastPid) { fileTab = P.files.length ? P.files[0].category : 'measure'; lastPid = P.project.id; }   // раздел последнего файла
      tab = 'projects'; go('project', push);
    }
    catch (e) { toast(e.message); }
    finally { app.classList.remove('loading'); }
  }
  async function refresh(detail) {
    if (detail && detail.project) P = detail;
    try { await loadState(); } catch (e) {}
    render();
  }

  function render() {
    markNav();
    app.replaceChildren();
    if (!S) return;
    if (tab === 'leads') return view === 'lead' && L ? leadView() : leadsView();
    if (tab === 'projects') return view === 'project' && P ? projectView() : projectsView();
    if (tab === 'money') return moneyView();
    if (tab === 'people') return peopleView();
  }

  // ---------- список проектов ----------
  function projectsView() {
    const head = el('div', 'row', el('h1', { class: 'grow' }, 'Проекты'),
      el('button', { class: 'btn primary small', type: 'button', onclick: () => projectSheet() }, '＋ Новый проект'),
      el('button', { class: 'icon-btn', type: 'button', title: 'Настройки: размер текста, бонус по умолчанию, тарифы, виды работ', 'aria-label': 'Настройки', onclick: settingsSheet }, '⚙︎'));
    app.append(head);
    const s = el('input', { class: 'search', type: 'search', placeholder: 'Найти: номер, заказчик, город', value: query });
    s.addEventListener('input', () => { query = s.value; drawList(); });
    app.append(s);
    const chips = el('div', 'chips');
    [['work', 'В работе'], ['done', 'Завершённые'], ['all', 'Все']].forEach(([k, t]) => chips.append(
      el('button', { class: 'chip', type: 'button', 'aria-pressed': String(filter === k), onclick: () => { filter = k; render(); } }, t)));
    app.append(chips);
    const list = el('div', 'plist'); app.append(list);
    function drawList() {
      list.replaceChildren();
      const q = query.trim().toLowerCase();
      const items = S.projects.filter((p) => (filter === 'all' || (filter === 'work' ? ['active', 'paused'].includes(p.status) : p.status === 'done'))
        && (!q || [p.number, p.title, p.client_name, p.city, p.tariff].join(' ').toLowerCase().includes(q)));
      if (!items.length) {
        list.append(el('div', 'empty', S.projects.length ? 'Ничего не нашлось' : 'Проектов пока нет. Нажмите «Новый проект» — и начнём.'));
        return;
      }
      items.forEach((p) => list.append(projectCard(p)));
    }
    drawList();
  }

  function projectCard(p) {
    const pct = p.total_eur > 0 ? Math.min(100, (p.paid / p.total_eur) * 100) : 0;
    const c = el('button', { class: 'pcard', type: 'button', onclick: () => openProject(p.id) },
      el('div', 'top', el('span', 'num', p.number ? '№ ' + p.number : 'без номера'), el('span', 'status ' + p.status, status(p.status))),
      el('div', 'title', p.title),
      el('div', 'sub', [p.client_name, p.city, p.tariff].filter(Boolean).join(' · ') || ' '));
    if (p.total_eur > 0) {
      const bar = el('div', 'bar'); bar.append(el('i', { style: 'width:' + pct + '%' }));
      c.append(bar, el('div', 'money num', el('span', null, 'Оплачено ', el('b', null, eur(p.paid)), ' из ' + eur(p.total_eur)),
        p.balance > 0.005 ? el('span', 'owe', 'Остаток ' + eur(p.balance)) : el('span', 'muted', p.balance < -0.005 ? 'Переплата ' + eur(-p.balance) : 'Оплачено полностью')));
    } else if (p.paid) c.append(el('div', 'money num', el('span', null, 'Оплачено ', el('b', null, eur(p.paid)))));
    if (p.extra) c.append(el('div', 'small muted num', 'Доп. доход: ' + eur(p.extra)));
    if (p.contractor_debt > 0) c.append(el('div', 'small owe num', 'Подрядчики должны бонусы: ' + eur(p.contractor_debt)));
    return c;
  }

  // ---------- проект ----------
  function projectView() {
    const { project: p, ops, files, contractors, client } = P;
    const head = el('div', 'card');
    head.append(el('div', 'row between', el('span', 'muted num', p.number ? '№ ' + p.number : 'без номера'), el('span', 'status ' + p.status, status(p.status))),
      el('h1', { style: 'margin:4px 0 4px' }, p.title),
      el('div', 'muted', [p.city, p.country, p.area ? num(p.area) + NB + 'м²' : '', p.tariff ? 'тариф «' + p.tariff + '»' : ''].filter(Boolean).join(' · ')));
    head.append(el('div', { style: 'margin-top:10px' }, el('button', { class: 'btn small', type: 'button', onclick: () => projectSheet(p) }, '✎ Изменить проект')));
    app.append(head);
    const jump = el('div', 'jump');                       // длинная страница на телефоне: сразу к нужному блоку
    [['sec-ops', 'Операции' + (ops.length ? ' · ' + ops.length : '')], ['sec-contractors', 'Подрядчики' + (contractors.length ? ' · ' + contractors.length : '')],
      ['sec-client', 'Заказчик'], ['sec-files', 'Файлы' + (files.length ? ' · ' + files.length : '')]].forEach(([id, t]) =>
      jump.append(el('button', { class: 'chip', type: 'button', onclick: () => document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' }) }, t)));
    app.append(jump);

    // деньги
    const m = el('section', { class: 'card', id: 'sec-money' });
    m.append(el('h2', null, 'Деньги'));
    m.append(el('dl', 'sum num',
      el('dt', null, 'Договор'), el('dd', null, eur(p.total_eur)),
      el('dt', null, 'Оплачено'), el('dd', null, eur(p.paid)),
      el('dt', null, p.balance < -0.005 ? 'Переплата' : 'Остаток к оплате'), el('dd', { class: p.balance > 0.005 ? 'owe' : '' }, eur(Math.abs(p.balance)))));
    if (p.total_eur > 0) { const bar = el('div', 'bar'); bar.append(el('i', { style: 'width:' + Math.min(100, (p.paid / p.total_eur) * 100) + '%' })); m.append(bar); }
    m.append(el('div', 'small muted num', 'Доп. доход: ', el('b', { style: 'color:var(--text-1)' }, eur(p.extra)),
      p.extra ? ' (бонусы ' + eur(p.bonus) + ', наценка ' + eur(p.margin) + ')' : '', ' · Всего доход по проекту: ', el('b', { style: 'color:var(--text-1)' }, eur(p.income))));
    if (p.contractor_debt > 0) m.append(el('div', { class: 'small num', style: 'margin-top:4px' },
      el('span', 'owe', 'Подрядчики должны бонусы: ' + eur(p.contractor_debt)), el('span', 'muted', ' — подробно в блоке «Подрядчики»')));
    m.append(el('div', 'actions',
      el('button', { class: 'btn', type: 'button', onclick: () => opSheet('payment') }, el('span', null, '💶'), 'Оплата'),
      el('button', { class: 'btn', type: 'button', onclick: () => opSheet('commission') }, el('span', null, '🎁'), 'Бонус'),
      el('button', { class: 'btn', type: 'button', onclick: () => opSheet('resale') }, el('span', null, '🔁'), 'Перепродажа')));
    app.append(m);

    // операции
    const o = el('section', { class: 'card', id: 'sec-ops' });
    o.append(el('h2', null, 'Операции'));
    if (!ops.length) o.append(el('p', 'muted small', 'Пока нет. Оплаты заказчика, бонусы и перепродажи появятся здесь — нажмите кнопку выше.'));
    else {
      const ul = el('ul', 'ops');
      ops.forEach((x) => ul.append(opRow(x)));
      o.append(ul);
    }
    app.append(o);

    // подрядчики: этапы, бонус студии, долг
    const k = el('section', { class: 'card', id: 'sec-contractors' });
    k.append(el('div', 'row between', el('h2', { style: 'margin:0' }, 'Подрядчики'), el('button', { class: 'btn small', type: 'button', onclick: linkSheet }, '＋ Добавить')));
    if (!contractors.length) k.append(el('p', 'muted small', 'Прораб, мебельщик, шторница, кондиционерщик, двери, окна… Добавьте подрядчика и его этапы с суммой заказа — бонус студии (по умолчанию '
      + pctText(S.lists.default_pct) + ') посчитается сам, а долг подрядчика будет виден здесь.'));
    contractors.forEach((x) => k.append(contractorBlock(x)));
    app.append(k);

    // заказчик
    const c = el('section', { class: 'card', id: 'sec-client' });
    c.append(el('div', 'row between', el('h2', { style: 'margin:0' }, 'Заказчик'),
      el('button', { class: 'btn small', type: 'button', onclick: () => clientSheet(client, (saved) => saveProjectField('client_id', saved.id)) }, client ? '✎' : '＋ Добавить')));
    if (client) c.append(personBlock(client));
    else c.append(el('p', 'muted small', 'Не указан. Нажмите «Добавить» или выберите в «Изменить проект».'));
    app.append(c);

    // файлы
    const f = el('section', { class: 'card', id: 'sec-files' });
    f.append(el('h2', null, 'Файлы проекта'));
    const tabs = el('div', 'chips');
    S.lists.file_cats.forEach(([key, name]) => {
      const n = files.filter((x) => x.category === key).length;
      tabs.append(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(fileTab === key), onclick: () => { fileTab = key; render(); } }, name + (n ? ' · ' + n : '')));
    });
    f.append(tabs);
    const list = files.filter((x) => x.category === fileTab);
    if (!list.length) f.append(el('p', 'muted small', 'Пока пусто. Добавьте файлы кнопкой ниже — или пришлите их боту в чат: он спросит, в какой проект и раздел.'));
    else {
      const g = el('div', 'gallery');
      list.forEach((x) => g.append(fileTile(x, list)));
      f.append(g);
    }
    // фото-разделы — выбор из фото и камеры; остальные — любые файлы (PDF, DWG, Word, Excel…)
    const input = el('input', { type: 'file', multiple: true, style: 'display:none', accept: S.lists.photo_cats.includes(fileTab) ? 'image/*,video/*,application/pdf' : null });
    input.addEventListener('change', () => upload([...input.files], fileTab));
    const catName = (S.lists.file_cats.find((x) => x[0] === fileTab) || ['', ''])[1];
    f.append(input, el('div', { style: 'height:10px' }), el('button', { class: 'btn wide', type: 'button', onclick: () => input.click() }, '＋ Добавить в «' + catName + '»'),
      el('p', { class: 'dnd-hint small muted', style: 'margin:8px 0 0;text-align:center' }, 'или перетащите файлы сюда, или вставьте из буфера (⌘V / Ctrl+V)'));
    f.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); f.classList.add('drop'); } });
    f.addEventListener('dragleave', (e) => { if (!f.contains(e.relatedTarget)) f.classList.remove('drop'); });
    f.addEventListener('drop', (e) => { e.preventDefault(); f.classList.remove('drop'); const fs = [...((e.dataTransfer && e.dataTransfer.files) || [])]; if (fs.length) upload(fs, fileTab); });
    app.append(f);

    // подробности
    const d = el('section', 'card');
    d.append(el('h2', null, 'Подробности'));
    const kv = el('dl', 'kv');
    [['Номер', p.number], ['Тариф', p.tariff], ['Площадь', p.area ? num(p.area) + ' м²' : ''], ['Город', [p.city, p.country].filter(Boolean).join(', ')],
      ['Адрес', p.address], ['Начало', dfmt(p.started)], ['Окончание', dfmt(p.finished)], ['Заметки', p.note]].forEach(([a, b]) => { if (b) kv.append(el('dt', null, a), el('dd', null, b)); });
    d.append(kv);
    if (P.history && P.history.length) {
      const det = el('details', { style: 'margin-top:12px' }, el('summary', null, 'История изменений'));
      const ul = el('ul', { class: 'people small' });
      const what = { project: 'проект', op: 'операцию', file: 'файл', link: 'подрядчика', stage: 'этап подрядчика' }, act = { add: 'добавил(а)', edit: 'изменил(а)', delete: 'удалил(а)' };
      P.history.forEach((h) => ul.append(el('li', null, el('div', 'who', el('span', null, dfmt(h.ts) + ' · ' + (h.who || '') + ' ' + (act[h.action] || h.action) + ' ' + (what[h.entity] || h.entity))))));
      det.append(ul); d.append(det);
    }
    d.append(el('div', { style: 'height:10px' }), el('button', { class: 'btn danger small', type: 'button', onclick: async () => {
      if (!(await confirmBox('Удалить проект «' + p.title + '»? Удалить можно только пустой проект — без операций и файлов.'))) return;
      try { await api('/api/crm/delete', { json: { entity: 'project', id: p.id } }); P = null; toast('Проект удалён'); stack.length = 0; view = 'list'; await refresh(); backBtn(); }
      catch (e) { toast(e.message); }
    } }, 'Удалить проект'));
    app.append(d);
  }

  function opRow(x) {
    const kinds = { payment: 'Оплата заказчика', commission: 'Бонус', resale: 'Перепродажа' };
    let what = kinds[x.kind], meta = [dfmt(x.day)];
    if (x.kind === 'payment') { if (x.method) meta.push(x.method); }
    if (x.kind === 'commission') {
      what = 'Бонус' + (x.counterparty ? ' · ' + x.counterparty : '');
      const k = x.link_id && P.contractors.find((y) => y.link_id === x.link_id);

  async function makeThumb(file) {
    if (!file.type.startsWith('image/')) return null;
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 640 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.8));
    } catch (e) { return null; }
  }

  const leadStatus = (s) => (S.lists.lead_statuses.find((x) => x[0] === s) || [s, s])[1];
  const FROM_LANG = { en: 'с английского', sk: 'со словацкого', de: 'с немецкого', uk: 'с украинского', pl: 'с польского', cs: 'с чешского',
    it: 'с итальянского', fr: 'с французского', es: 'с испанского', hu: 'с венгерского' };
  function dtime(s) {
    const d = new Date(s);
    if (isNaN(d)) return dfmt(s);
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '') + ', '
      + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  // контакт из формы сайта — одной строкой: телефон, почта или ник; разобрать для кнопок «позвонить / написать»
  function parseContact(s) {
    s = (s || '').trim();
    const out = { phone: '', email: '', messenger: '', pref: '' };
    const em = s.match(/[^\s@,;:<>()]+@[^\s@,;:<>()]+\.[A-Za-z]{2,}/);
    if (em) out.email = em[0];
    const ph = s.replace(em ? em[0] : '', ' ').match(/\+?\d[\d\s().-]{6,}\d/);
    if (ph) out.phone = ph[0].trim();
    const nick = !em && s.match(/(^|\s)@([A-Za-z0-9_]{4,})/);
    if (nick) { out.messenger = '@' + nick[2]; out.pref = 'Telegram'; }
    if (out.email && !out.phone) out.pref = 'E-mail';
    if (!out.email && !out.phone && !out.messenger) out.messenger = s;
    return out;
  }

      const p = sv('path', { d, fill: 'var(--series)' }); svg.append(p); bars.push(p);

      const label = MON[mm - 1] + (yy !== year ? ' ' + yy : ''), w = label.length * 6.3 * k, lx = cx - w / 2;

  function sheet(title, body, onSave, saveLabel, extra) {
    const err = el('p', 'err', ''); err.hidden = true;
    const sh = el('div', 'sheet');
    const inner = el('div', 'in');
    inner.append(el('header', null, el('h2', null, title), el('button', { class: 'btn small', type: 'button', onclick: () => closeSheet(sh) }, 'Закрыть')), err, body);
    sh.append(inner);
    const rec = { el: sh, label: saveLabel || 'Сохранить', run: null };
    let busy = false, saveBtn = null;
    if (onSave) rec.run = async () => {
      if (busy) return;
      busy = true; err.hidden = true;
      if (saveBtn) saveBtn.disabled = true;
      if (MB) try { MB.showProgress(false); } catch (e) {}
      try { await onSave(); closeSheet(sh); }
      catch (e) { err.textContent = e.message; err.hidden = false; sh.scrollTo(0, 0); if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('error'); } catch (x) {} }
      finally { busy = false; if (saveBtn) saveBtn.disabled = false; if (MB) try { MB.hideProgress(); } catch (e) {} }
    };
    if (onSave && !MB) saveBtn = el('button', { class: 'btn primary', type: 'button', style: 'flex:1', onclick: () => rec.run() }, rec.label);
    const kids = [...(extra || []), saveBtn].filter(Boolean);

  // сумма + валюта + курс (подтягивается сам; можно ввести вручную)
  function moneyField(label, amount, currency, rateVal, manual, dayInput, hint) {
    const a = inp(amount, { inputmode: 'decimal', placeholder: '0' });
    const c = sel(S.lists.currencies.map(([code, sym, name]) => [code, code + ' ' + sym]), currency || 'EUR', { 'aria-label': 'Валюта' });
    const info = el('div', 'rate');
    const man = el('input', { type: 'checkbox' }); man.checked = !!manual;
    const r = inp(rateVal || '', { inputmode: 'decimal', placeholder: 'Сколько ' + (currency || '') + ' в 1 €' });
    const rateBox = el('div', { style: 'margin-top:8px' }, r);
    const manWrap = el('label', 'check', man, 'Ввести курс вручную (например, курс банка)');
    const w = el('div', 'field', el('label', null, label), el('div', 'pair', a, c), info, manWrap, rateBox, hint ? el('div', 'hint', hint) : null);
    let auto = null, seq = 0, inEur = null;
    const done = (v) => { inEur = v; w.dispatchEvent(new Event('eur')); };
    async function upd() {
      const cur = c.value, amt = parseFloat((a.value || '').replace(/\s/g, '').replace(',', '.'));
      const isEur = cur === 'EUR';
      manWrap.hidden = isEur; rateBox.hidden = isEur || !man.checked;
      r.placeholder = 'Сколько ' + cur + ' в 1 €';
      if (isEur) { info.textContent = ''; return done(amt > 0 ? amt : null); }
      if (man.checked) {
        const rv = parseFloat((r.value || '').replace(',', '.'));
        info.replaceChildren(rv > 0 && amt > 0 ? el('span', null, 'Это ', el('b', null, eur(amt / rv)), ' по вашему курсу') : '');
        return done(rv > 0 && amt > 0 ? amt / rv : null);
      }
      const my = ++seq;
      info.textContent = 'Узнаю курс…';
      try {
        auto = await api('/api/crm/rate?cur=' + cur + '&day=' + (dayInput.value || todayISO()));
        if (my !== seq) return;
        info.replaceChildren(el('span', null, 'Курс ' + srcText(auto.src) + ': 1 € = ', el('b', null, num(auto.rate, 4) + ' ' + (SYM[cur] || cur)),
          amt > 0 ? el('span', null, ' · это ', el('b', null, eur(amt / auto.rate))) : ''));
        done(amt > 0 ? amt / auto.rate : null);
      } catch (e) { if (my === seq) { info.replaceChildren(el('span', { style: 'color:var(--down)' }, e.message)); done(null); } }
    }
    [a, r].forEach((x) => x.addEventListener('input', upd)); [c, man, dayInput].forEach((x) => x.addEventListener('change', upd));
    upd();
    w.value = () => ({ amount: a.value, currency: c.value, manual_rate: c.value !== 'EUR' && man.checked, rate: r.value });
    w.eur = () => inEur;
    w.set = (amount, currency) => { a.value = amount; if (currency) c.value = currency; upd(); };
    return w;
  }

  // этап работ подрядчика: сумма заказа и бонус студии — процент (по умолчанию из настроек), сумма или «пока неизвестно»
  function stageSheet(x, st) {
    const isNew = !st;
    const last = x.money.stages[x.money.stages.length - 1];
    st = st || { day: todayISO(), currency: last ? last.currency : 'EUR' };
    let mode = isNew ? 'pct' : st.commission == null ? 'unknown' : st.pct != null ? 'pct' : 'sum';
    const day = inp(st.day, { type: 'date' });
    const title = inp(st.title, { placeholder: 'Кухня, черновые, 1-й этап…' });
    const amt = moneyField('Сумма заказа', st.amount || '', st.currency, st.rate_src === 'вручную' ? st.rate : '', st.rate_src === 'вручную', day,
      'На какую сумму подрядчик делает эту работу');
    const pct = inp(st.pct != null ? num(st.pct, 2).replace(/\s/g, '') : num(S.lists.default_pct, 2), { inputmode: 'decimal', 'aria-label': 'Процент' });
    const sum = inp(mode === 'sum' ? st.commission : '', { inputmode: 'decimal', placeholder: '0', 'aria-label': 'Сумма бонуса' });
    const curLab = el('span', 'muted');
    const pctBox = el('div', { class: 'pair', style: 'margin-top:8px;grid-template-columns:1fr auto;align-items:center' }, pct, el('span', 'muted', '% от суммы заказа'));
    const sumBox = el('div', { class: 'pair', style: 'margin-top:8px;grid-template-columns:1fr auto;align-items:center' }, sum, curLab);
    const unk = el('div', 'hint', 'Когда подрядчик отдаст бонус — нажмите «Отдал бонус» у него в проекте: сумма засчитается в доход проекта.');
    const out = el('div', 'rate');
    const seg = el('div', 'seg');
    const modes = [['pct', 'Процент'], ['sum', 'Сумма'], ['unknown', 'Неизвестно']];
    function draw() {
      seg.replaceChildren(...modes.map(([k, t]) => el('button', { type: 'button', 'aria-pressed': String(mode === k), onclick: () => { mode = k; draw(); } }, t)));
      pctBox.hidden = mode !== 'pct'; sumBox.hidden = mode !== 'sum'; unk.hidden = mode !== 'unknown';
      const v = amt.value(), a = parseNum(v.amount), cur = v.currency, e = amt.eur();
      curLab.textContent = cur;
      let b = null;
      if (mode === 'pct' && a > 0 && parseNum(pct.value) > 0) b = a * parseNum(pct.value) / 100;
      if (mode === 'sum' && parseNum(sum.value) > 0) b = parseNum(sum.value);
      out.replaceChildren(b == null ? '' : el('span', null, 'Бонус студии: ', el('b', null, curMoney(b, cur)),
        cur !== 'EUR' && e && a > 0 ? ' ≈ ' + eur(e * b / a) : '', mode === 'sum' && a > 0 ? ' · ' + pctText(b / a * 100) + ' от заказа' : ''));
    }
    amt.addEventListener('eur', draw); [pct, sum].forEach((i) => i.addEventListener('input', draw));
    draw();
    const note = area(st.note, { placeholder: 'Сроки, условия, что входит (по желанию)' });
    const body = el('div', el('p', 'muted small', x.name + ((x.link_trade || x.trade) ? ' · ' + (x.link_trade || x.trade) : '')),
      field('Что делают', title), field('Дата', day), amt,
      el('div', 'field', el('span', 'lab', 'Бонус студии'), seg, pctBox, sumBox, unk, out), field('Комментарий', note));
    const del = st.id ? [el('button', { class: 'btn danger', type: 'button', onclick: async () => {
      if (!(await confirmBox('Удалить этап «' + (st.title || 'без названия') + '»? Полученные бонусы останутся за подрядчиком.'))) return;
      try { await refresh(await api('/api/crm/delete', { json: { entity: 'stage', id: st.id } })); closeSheets(); toast('Этап удалён'); } catch (e) { toast(e.message); }
    } }, 'Удалить')] : [];
    sheet(isNew ? 'Новый этап' : 'Этап работ', body, async () => {
      const v = amt.value();
      await refresh(await save('stage', { id: st.id, project_id: P.project.id, link_id: x.link_id, title: title.value, day: day.value,
        amount: v.amount || 0, currency: v.currency, manual_rate: v.manual_rate, rate: v.rate, mode, pct: pct.value, commission: sum.value, note: note.value }));
      toast('Сохранено');
    }, null, del);
  }

  function clientSheet(c, after) {
    c = c || {};
    const f = { name: inp(c.name, { placeholder: 'Имя и фамилия', autocomplete: 'off' }), phone: inp(c.phone, { type: 'tel', placeholder: '+421 …' }),
      email: inp(c.email, { type: 'email', placeholder: 'name@example.com' }), messenger: inp(c.messenger, { placeholder: '@ник в Telegram или номер' }),
      contact_pref: sel([['', '— не указано —']].concat(S.lists.contact_prefs), c.contact_pref), city: cityInput(c.city), note: area(c.note, { placeholder: 'Как познакомились, пожелания, дни рождения…' }) };
    const body = el('div', field('Имя', f.name), field('Телефон', f.phone), field('E-mail', f.email), field('Мессенджер', f.messenger),
      field('Как удобнее связаться', f.contact_pref), field('Город', f.city), field('Заметки', f.note));
    const del = c.id ? [el('button', { class: 'btn danger', type: 'button', onclick: async () => {
      if (!(await confirmBox('Удалить заказчика «' + c.name + '»?'))) return;
      try { await api('/api/crm/delete', { json: { entity: 'client', id: c.id } }); closeSheets(); toast('Удалено'); await refresh(); } catch (e) { toast(e.message); }
    } }, 'Удалить')] : [];
    sheet(c.id ? 'Заказчик' : 'Новый заказчик', body, async () => {
      const saved = await save('client', { id: c.id, name: f.name.value, phone: f.phone.value, email: f.email.value, messenger: f.messenger.value,
        contact_pref: f.contact_pref.value, city: f.city.input.value, note: f.note.value });
      toast('Сохранено');
      if (after) await after(saved); else await refresh();
    }, null, del);
  }

  function contractorSheet(c, after) {
    c = c || {};
    const f = { name: inp(c.name, { placeholder: 'Имя', autocomplete: 'off' }), trade: sel([['', '— выберите —']].concat(S.lists.trades), c.trade),
      company: inp(c.company, { placeholder: 'Фирма (по желанию)' }), phone: inp(c.phone, { type: 'tel', placeholder: '+421 …' }),
      email: inp(c.email, { type: 'email' }), contact_pref: sel([['', '— не указано —']].concat(S.lists.contact_prefs), c.contact_pref),
      city: cityInput(c.city), note: area(c.note, { placeholder: 'Цены, качество, сроки…' }) };
    const body = el('div', field('Имя', f.name), field('Вид работ', f.trade), field('Компания', f.company), field('Телефон', f.phone), field('E-mail', f.email),
      field('Как удобнее связаться', f.contact_pref), field('Город', f.city), field('Заметки', f.note));
    const del = c.id && !c.link_id ? [el('button', { class: 'btn danger', type: 'button', onclick: async () => {
      if (!(await confirmBox('Удалить подрядчика «' + c.name + '»?'))) return;
      try { await api('/api/crm/delete', { json: { entity: 'contractor', id: c.id } }); closeSheets(); toast('Удалено'); await refresh(); } catch (e) { toast(e.message); }
    } }, 'Удалить')] : [];
    sheet(c.id ? 'Подрядчик' : 'Новый подрядчик', body, async () => {
      const saved = await save('contractor', { id: c.id, name: f.name.value, trade: f.trade.value, company: f.company.value, phone: f.phone.value,
        email: f.email.value, contact_pref: f.contact_pref.value, city: f.city.input.value, note: f.note.value });
      toast('Сохранено');
      if (after) await after(saved); else { if (P) P = await api('/api/crm/project?id=' + P.project.id); await refresh(); }
    }, null, del);
  }

  function linkSheet() {
    const trade = sel([['', 'Все виды работ']].concat(S.lists.trades), '');
    const list = el('div', 'pick');
    const draw = () => {
      list.replaceChildren();
      const items = S.contractors.filter((c) => !trade.value || c.trade === trade.value);
      if (!items.length) list.append(el('p', 'muted small', 'Здесь пока никого. Добавьте нового подрядчика — он сохранится в контактах.'));
      items.forEach((c) => list.append(el('button', { class: 'btn', type: 'button', onclick: () => attach(c) },
        el('span', 'grow', el('b', null, c.name), el('span', 'small muted', ' · ' + [c.trade, c.phone].filter(Boolean).join(' · '))))));
    };
    async function attach(c) {
      try { await refresh(await save('link', { project_id: P.project.id, contractor_id: c.id, trade: trade.value || c.trade })); closeSheets(); toast('Добавлено в проект'); }
      catch (e) { toast(e.message); }
    }
    trade.addEventListener('change', draw); draw();
    sheet('Подрядчик в проект', el('div', field('Вид работ', trade), list), null, null,
      [el('button', { class: 'btn primary', type: 'button', style: 'flex:1', onclick: () => contractorSheet({ trade: trade.value }, attach) }, '＋ Новый подрядчик')]);
  }

  function settingsSheet() {
    const L = S.lists;
    const f = { tariffs: area(L.tariffs.join('\n')), trades: area(L.trades.join('\n')), commission_cats: area(L.commission_cats.join('\n')),
      default_pct: inp(num(L.default_pct, 2), { inputmode: 'decimal' }) };
    // размер текста — сразу, без «Сохранить», и только для того, кто открыл (у каждого свой)
    const sizeSeg = el('div', 'seg');
    const drawSize = () => sizeSeg.replaceChildren(...SIZES.map(([k, t]) => el('button', { type: 'button', 'aria-pressed': String((document.documentElement.dataset.size || 'm') === k),
      onclick: async () => {
        applySize(k); drawSize(); render(); syncSheets();
        try { await api('/api/crm/ui', { json: { size: k } }); } catch (e) { toast(e.message); }
      } }, t)));
    drawSize();
    const body = el('div', el('div', 'field', el('span', 'lab', 'Размер текста'), sizeSeg, el('div', 'hint', 'Только для вас, на всех ваших устройствах — и в «Студии», и в графиках сайта')),
      field('Бонус студии с заказа подрядчика, %', f.default_pct, 'Подставляется в каждый новый этап; в самом этапе можно поменять'),
      el('p', 'muted small', 'Списки: каждый пункт — с новой строки. Уже внесённые проекты не меняются.'),
      field('Тарифы', f.tariffs), field('Виды работ подрядчиков', f.trades), field('За что бывают бонусы от поставщиков', f.commission_cats),
      el('p', 'small muted', 'Файлы проектов на сервере: ' + num((S.disk.used || 0) / 1048576, 1) + ' МБ' + (S.disk.free ? ' · свободно ' + num(S.disk.free / 1073741824, 1) + ' ГБ' : '')));
    sheet('Настройки', body, async () => {
      const split = (t) => t.value.split('\n').map((x) => x.trim()).filter(Boolean);
      S.lists = Object.assign(S.lists, await save('lists', { tariffs: split(f.tariffs), trades: split(f.trades), commission_cats: split(f.commission_cats), default_pct: f.default_pct.value }));
      toast('Сохранено'); render();
    });
  }

  // ---------- старт ----------
  async function start() {
    if (!INIT) { app.replaceChildren(el('div', 'card muted', 'Откройте «Студию» кнопкой в боте студии DUMSKAYA DESIGN.')); return; }
    try { await loadState(); }
    catch (e) { app.replaceChildren(el('div', 'card muted', e.message)); return; }
    if (S.me && S.me.size) applySize(S.me.size);
    const q = new URLSearchParams(location.search);            // из кнопки в сообщении бота: проект, заявка, доступ
    if (q.get('project')) return openProject(q.get('project'), false);
    if (q.get('lead')) { tab = 'leads'; return openLead(q.get('lead'), false); }
    if (q.get('tab') === 'access') { tab = 'people'; peopleTab = 'access'; }
    else if (q.get('tab') === 'leads') tab = 'leads';
    render();
  }
  document.addEventListener('dragover', (e) => e.preventDefault());       // файл, брошенный мимо, не открывается вместо «Студии»
  document.addEventListener('drop', (e) => e.preventDefault());
  document.addEventListener('paste', (e) => {
    if (tab !== 'projects' || view !== 'project' || !P || sheets.length || document.querySelector('.viewer')) return;
    const fs = [...((e.clipboardData && e.clipboardData.files) || [])];
    if (!fs.length) return;
    e.preventDefault();
    const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, '-');
    upload(fs.map((x, i) => (x.name && x.name !== 'image.png' ? x
      : new File([x], 'вставка-' + todayISO() + '-' + stamp + (fs.length > 1 ? '-' + (i + 1) : '') + '.' + ((x.type.split('/')[1] || 'png').replace('jpeg', 'jpg')), { type: x.type }))), fileTab);
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (tab === 'money') render(); }, 200); });
  start();
})();
</script>
</body>
</html>

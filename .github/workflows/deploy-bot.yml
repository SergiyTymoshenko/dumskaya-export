# Выкладка бота и «Студии»: после каждого коммита в main, где менялась папка deploy/, GitHub проверяет код Python
# и передаёт папку deploy/ на сервер. Там её принимает /usr/local/lib/dumskaya/autodeploy (deploy/autodeploy.sh):
# кладёт файлы, перезапускает сервис заявок и ждёт, пока он ответит; не ответил — возвращает прежнюю версию.
# Ключ сервера умеет только это (command=…,restrict в authorized_keys): ни оболочки, ни других папок.
# Сайт (страницы, тексты, фото, переадресации) по-прежнему выкладывается с Мака: npm run deploy.
# Настройка один раз, с Мака: npm run autodeploy — создаёт ключ и секрет DUMSKAYA_DEPLOY. Без секрета ничего не делает.
name: Выкладка бота и «Студии»

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'SergiyTymoshenko/dumskaya-export'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Код Python без ошибок
        run: python3 -m py_compile deploy/*.py

      - name: На сервер
        env:
          CONF: ${{ secrets.DUMSKAYA_DEPLOY }}
        run: |
          if [ -z "$CONF" ]; then
            echo "::notice::Автовыкладка не настроена — на Маке: npm run autodeploy"
            exit 0
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$CONF" | base64 -d > "$RUNNER_TEMP/conf"
          get() { sed -n "s/^$1=//p" "$RUNNER_TEMP/conf" | head -n 1; }
          H="$(get HOST)"; P="$(get PORT)"; U="$(get USER)"
          echo "::add-mask::$H"
          get KNOWN | base64 -d > ~/.ssh/known_hosts
          get KEY | base64 -d > ~/.ssh/dumskaya
          rm -f "$RUNNER_TEMP/conf"
          SUBJ="$(git log -1 --format=%s | cut -c1-200 | base64 -w0)"
          # версия — мелко внизу «Студии»: коммит · когда · откуда
          printf '%s · %s · GitHub\n' "$(git rev-parse --short HEAD)" "$(TZ=Europe/Bratislava date '+%d.%m.%Y %H:%M')" > deploy/VERSION
          tar --exclude=__pycache__ -cf - deploy | ssh -i ~/.ssh/dumskaya -F /dev/null -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            -p "${P:-22}" "$U@$H" "$GITHUB_SHA $SUBJ"
